<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Futuristic Bottle — Three.js</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #140a1f;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  canvas { display: block; }
  #overlay {
    position: fixed;
    top: 20px;
    left: 24px;
    color: #ffd9a8;
    text-shadow: 0 0 12px rgba(255, 122, 26, 0.6);
    pointer-events: none;
    user-select: none;
  }
  #overlay h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 0.08em;
    font-weight: 600;
    background: linear-gradient(90deg, #ffd23f, #ff7a1a, #ff2e93);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #overlay p {
    margin: 6px 0 0;
    font-size: 12px;
    opacity: 0.7;
    letter-spacing: 0.04em;
  }
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ff9a3f;
    font-size: 14px;
    letter-spacing: 0.1em;
    background: #140a1f;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="overlay">
  <h1>FUTURISTIC BOTTLE</h1>
  <p>drag to orbit · scroll to zoom</p>
</div>
<div id="loading">LOADING SCENE…</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/core/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x140a1f);
scene.fog = new THREE.FogExp2(0x140a1f, 0.045);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 2.2, 6.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);
document.getElementById("loading").remove();

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 1.4, 0);
controls.minDistance = 3;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.55;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;

// ---------- Lighting: warm + vibrant rim lights ----------
scene.add(new THREE.AmbientLight(0x2a1030, 0.6));

const key = new THREE.PointLight(0xff7a1a, 25, 20, 2);
key.position.set(3, 5, 4);
scene.add(key);

const rimPink = new THREE.PointLight(0xff2e93, 18, 20, 2);
rimPink.position.set(-4, 2, -3);
scene.add(rimPink);

const rimGold = new THREE.PointLight(0xffd23f, 12, 15, 2);
rimGold.position.set(0, -1, 3);
scene.add(rimGold);

const hemi = new THREE.HemisphereLight(0xffb37a, 0x1a0a20, 0.5);
scene.add(hemi);

// ---------- Bottle profile (Lathe) ----------
const profile = [
  [0.0, 0.0], [0.58, 0.0], [0.66, 0.06], [0.68, 0.35], [0.66, 0.85],
  [0.58, 1.35], [0.52, 1.7], [0.5, 1.88], [0.34, 2.08], [0.22, 2.18],
  [0.2, 2.24], [0.2, 2.95], [0.25, 3.0], [0.27, 3.06], [0.24, 3.12], [0.0, 3.14],
].map(([x, y]) => new THREE.Vector2(x, y));

const bottleGeo = new THREE.LatheGeometry(profile, 96);
const bottleMat = new THREE.MeshPhysicalMaterial({
  color: 0xff7a1a,
  metalness: 0.0,
  roughness: 0.05,
  transmission: 0.75,
  thickness: 1.6,
  ior: 1.4,
  clearcoat: 1.0,
  clearcoatRoughness: 0.05,
  emissive: 0xff3a00,
  emissiveIntensity: 0.12,
  attenuationColor: 0xff5a1f,
  attenuationDistance: 1.2,
});
const bottle = new THREE.Mesh(bottleGeo, bottleMat);
bottle.position.y = 0;
scene.add(bottle);

// glowing liquid core inside the bottle
const liquidGeo = new THREE.CylinderGeometry(0.55, 0.5, 1.6, 48);
const liquidMat = new THREE.MeshStandardMaterial({
  color: 0xffb020,
  emissive: 0xff6a00,
  emissiveIntensity: 1.4,
  roughness: 0.3,
});
const liquid = new THREE.Mesh(liquidGeo, liquidMat);
liquid.position.y = 0.85;
scene.add(liquid);

// glowing accent rings around the neck
const ringGeo = new THREE.TorusGeometry(0.24, 0.035, 16, 64);
const ringMat = new THREE.MeshStandardMaterial({
  color: 0xff2e93,
  emissive: 0xff2e93,
  emissiveIntensity: 2.2,
});
const ring1 = new THREE.Mesh(ringGeo, ringMat);
ring1.rotation.x = Math.PI / 2;
ring1.position.y = 2.2;
scene.add(ring1);

const ring2 = ring1.clone();
ring2.position.y = 2.75;
ring2.scale.setScalar(0.85);
scene.add(ring2);

// glowing base pedestal
const baseGeo = new THREE.CylinderGeometry(0.9, 0.95, 0.12, 64);
const baseMat = new THREE.MeshStandardMaterial({
  color: 0xffd23f,
  emissive: 0xffb020,
  emissiveIntensity: 1.0,
  metalness: 0.6,
  roughness: 0.3,
});
const base = new THREE.Mesh(baseGeo, baseMat);
base.position.y = -0.06;
scene.add(base);

// reflective floor
const floorGeo = new THREE.CircleGeometry(6, 64);
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x1a0a20,
  roughness: 0.55,
  metalness: 0.25,
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.13;
scene.add(floor);

// floating warm-colored particles for a sci-fi atmosphere
const particleCount = 120;
const particleGeo = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount; i++) {
  const angle = Math.random() * Math.PI * 2;
  const radius = 1.5 + Math.random() * 3.5;
  positions[i * 3] = Math.cos(angle) * radius;
  positions[i * 3 + 1] = Math.random() * 4.5;
  positions[i * 3 + 2] = Math.sin(angle) * radius;
}
particleGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
const particleMat = new THREE.PointsMaterial({
  color: 0xffb347,
  size: 0.05,
  transparent: true,
  opacity: 0.8,
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// ---------- Bloom post-processing for the neon glow ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.1,
  0.6,
  0.15
);
composer.addPass(bloomPass);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.01;
  bottle.rotation.y += 0.002;
  liquid.rotation.y -= 0.006;
  ring1.rotation.z += 0.01;
  ring2.rotation.z -= 0.008;
  particles.rotation.y += 0.0012;
  key.intensity = 22 + Math.sin(t * 2) * 4;
  rimPink.intensity = 16 + Math.cos(t * 1.7) * 3;
  controls.update();
  composer.render();
}
animate();
</script>
</body>
</html>
