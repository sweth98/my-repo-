<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stickman — The Counter</title>
<style>
  :root {
    --bg: #e9e6dd; --panel: #f4f1ea; --ink: #141414; --muted: #6f6a5e; --line: #cfcabd;
    --accent: #c8412b; --chip: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17160f; --panel: #201f17; --ink: #efece2; --muted: #a29d8d; --line: #3a382c; --chip: #2a2820; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { max-width: 1180px; margin: 0 auto; padding: 20px 16px 32px; }
  h1 { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 12px; font-weight: 650; }
  h1 span { color: var(--muted); font-weight: 400; letter-spacing: .04em; text-transform: none; margin-left: 10px; }
  .stage { position: relative; border-radius: 6px; overflow: hidden; background: #f4f1ea;
    box-shadow: 0 1px 0 var(--line), 0 18px 40px -22px rgba(0,0,0,.45); }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 16/9; }
  .beat { position: absolute; left: 18px; bottom: 66px; color: #f4f1ea; font-size: 12px; letter-spacing: .12em;
    text-transform: uppercase; }
  .beat b { color: var(--accent); margin-right: 8px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 14px 0 10px; }
  button, select { font: inherit; color: var(--ink); background: var(--chip); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 12px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); min-width: 78px; font-weight: 600; }
  button:disabled { opacity: .6; cursor: progress; }
  label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
  .sp { flex: 1; }
  .readout { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 150px; text-align: right; }
  .tl { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px 12px; }
  .track { position: relative; cursor: ew-resize; touch-action: none; user-select: none; padding-top: 4px; }
  .ruler { position: relative; height: 16px; border-bottom: 1px solid var(--line); }
  .ruler u { position: absolute; top: 0; text-decoration: none; font-size: 10px; color: var(--muted);
    border-left: 1px solid var(--line); padding-left: 4px; height: 16px; }
  .beats { position: relative; height: 30px; }
  .beat-chip { position: absolute; top: 4px; transform: translateX(0); padding: 2px 8px 2px 6px; font-size: 11px;
    border-radius: 3px; white-space: nowrap; background: transparent; border: 0; border-left: 2px solid var(--muted);
    border-radius: 0; color: var(--muted); cursor: pointer; }
  .beat-chip i { font-style: normal; margin-right: 5px; opacity: .7; }
  .beat-chip.on { color: var(--ink); border-left-color: var(--accent); font-weight: 600; }
  .lane { position: relative; height: 22px; border-top: 1px dashed var(--line); }
  .lane span { position: absolute; left: 0; top: 3px; font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); z-index: 1; background: var(--panel); padding-right: 6px; }
  .lane em { position: absolute; top: 7px; width: 8px; height: 8px; margin-left: -4px; background: var(--ink);
    transform: rotate(45deg) scale(.85); opacity: .75; }
  .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); pointer-events: none; margin-left: -1px; }
  .playhead::before { content: ""; position: absolute; top: -2px; left: -5px; border: 6px solid transparent; border-top-color: var(--accent); }
  #scrub { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .status { margin-top: 10px; color: var(--muted); min-height: 1.4em; }
  .hint { margin-top: 6px; color: var(--muted); font-size: 12px; }
  kbd { background: var(--chip); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; font: 11px ui-monospace, monospace; }
  @media (max-width: 640px) { .readout { text-align: left; } .beat-chip { font-size: 10px; } }
</style>
</head>
<body>
<div class="app">
  <h1>The Counter <span>stickman action short · skeletal rig · 30 fps</span></h1>

  <div class="stage">
    <canvas id="stage" width="1280" height="720" aria-label="Stickman animation"></canvas>
    <div class="beat" id="beat"></div>
  </div>

  <div class="bar" role="toolbar" aria-label="Transport">
    <button id="play" class="primary" data-state="paused">Play</button>
    <button id="restart">Restart</button>
    <button id="prev" title="Previous frame (←)" aria-label="Previous frame">◂ Frame</button>
    <button id="next" title="Next frame (→)" aria-label="Next frame">Frame ▸</button>
    <label>Speed
      <select id="speed">
        <option value="0.1">0.1×</option><option value="0.25">0.25×</option><option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
      </select>
    </label>
    <label><input type="checkbox" id="loop"> Loop</label>
    <label><input type="checkbox" id="bars" checked> Cinema bars</label>
    <label><input type="checkbox" id="trails" checked> Trails</label>
    <span class="sp"></span>
    <button id="png">Save frame</button>
    <button id="export">Export video</button>
    <span class="readout"><span id="frame">000</span> · <span id="time">0.00 s</span></span>
  </div>

  <div class="tl">
    <div class="track" id="track" role="slider" aria-label="Timeline" tabindex="-1">
      <div class="ruler" id="ruler"></div>
      <div class="beats" id="beats"></div>
      <div id="lanes"></div>
      <div class="playhead" id="playhead"></div>
    </div>
    <input id="scrub" type="range" min="0" max="100" value="0" aria-label="Frame scrubber">
  </div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="hint"><kbd>Space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> step a frame (<kbd>Shift</kbd> = 10) · <kbd>Home</kbd> restart · drag the timeline to scrub. Time is stretched around the kick (slow-motion and a hit-stop), so the timeline is in display frames.</div>
</div>
<script src="js/rig.js"></script>
<script src="js/anim.js"></script>
<script src="js/choreo.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
