services:
  # ---------------------------------------------------------------------------
  # Frontend: static bundle on hardened nginx, and the only container reachable
  # from the host.
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./web
    image: secure-dummy-web:local
    depends_on:
      api:
        condition: service_healthy

    # Loopback only. Without the 127.0.0.1 prefix, Docker writes an iptables
    # rule that bypasses the host firewall and exposes this to everyone on the
    # network you are connected to.
    ports:
      - "127.0.0.1:8080:8080"

    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m,noexec,nosuid,nodev
      - /var/cache/nginx:mode=0700,uid=101,gid=101,size=32m,noexec,nosuid,nodev
      - /var/run:mode=0755,uid=101,gid=101,size=1m,noexec,nosuid,nodev

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "101:101"

    restart: unless-stopped
    init: true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - frontend
      - backend

  # ---------------------------------------------------------------------------
  # API: holds the secrets. Note the complete absence of a `ports:` block.
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./api
    image: secure-dummy-api:local

    # No ports. The API is unreachable from the host and from the internet; the
    # only path to it is nginx's /api/ proxy on the internal network. Run
    # `curl localhost:3000` and you get nothing - that is the point.

    environment:
      # Secrets live here, in the server-side container, and are never built
      # into the frontend bundle. This is the difference that matters: a VITE_*
      # variable is public, this is not.
      SESSION_SECRET: ${SESSION_SECRET:?run ./generate-secrets.sh to create .env}
      DEMO_USER: ${DEMO_USER:-demo}
      DEMO_PASSWORD_HASH: ${DEMO_PASSWORD_HASH:?run ./generate-secrets.sh to create .env}
      # Plain http on localhost, so the Secure flag would stop the cookie from
      # ever being sent. Set to "true" the moment real TLS is involved.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      PORT: "3000"

    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m,noexec,nosuid,nodev

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"

    restart: unless-stopped
    # Reaps zombie processes and forwards signals, so `docker compose down` is
    # a clean shutdown rather than a kill after the timeout.
    init: true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

    networks:
      - backend

networks:
  # Carries the published port. Only `web` sits here.
  frontend:
    driver: bridge

  # internal: true means no route to or from the outside world - not even
  # outbound. The API cannot be reached from your LAN, and a compromised API
  # container cannot call home. Only containers on this network can talk to it.
  backend:
    driver: bridge
    internal: true
