server {
    # 8080 because an unprivileged process cannot bind below 1024.
    # IPv4 only: a `listen [::]:8080;` line aborts nginx at startup on hosts
    # where IPv6 is disabled inside the container, which is a common default.
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    client_max_body_size  64k;
    client_body_timeout   10s;
    client_header_timeout 10s;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/manifest+json;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ----------------------------------------------------------------------
    # API proxy
    # ----------------------------------------------------------------------
    # The API is never published on a host port. It is reachable only on the
    # internal Docker network, through this location. That means the only way
    # in is past these headers and limits, and the browser sees a single
    # origin - so there is no CORS policy to misconfigure and SameSite=Strict
    # cookies work.
    location /api/ {
        # Docker's embedded DNS, re-resolved every 10s. Without a variable in
        # proxy_pass, nginx resolves "api" once at startup and refuses to boot
        # if the API container is not up yet - and never notices a new IP if it
        # restarts. $request_uri preserves the full path and query string,
        # which nginx does not substitute automatically when the target is a
        # variable.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api_host "api";
        proxy_pass http://$api_host:3000$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The API sets `trust proxy` to 1, so it reads the last entry here as
        # the client IP. That is what the rate limiter keys on.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Don't let a slow or hung upstream tie up connections indefinitely.
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;

        # Declaring any add_header here stops the HTML security headers above
        # from applying to API responses. That is intentional: helmet already
        # sets nosniff, framing and referrer headers on these responses, and a
        # second Content-Security-Policy would be intersected with the first.
        #
        # Only Cache-Control is set, because helmet does not set it. Do not add
        # nosniff here - helmet's copy is already present and the result is a
        # duplicate header that security scanners flag.
        add_header Cache-Control "no-store" always;
    }

    # ----------------------------------------------------------------------
    # Static assets
    # ----------------------------------------------------------------------
    # Vite fingerprints these filenames, so the content behind a given name can
    # never change and it is safe to cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Belt and braces: nothing sensitive should ever be in the image, but do
    # not serve it if it is.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
    location ~* \.(env|map|bak|old|swp)$ {
        deny all;
        return 404;
    }

    # Client-side routing catch-all. Must stay last.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
