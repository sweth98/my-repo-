# Security response headers for the HTML app.
#
# nginx's add_header does NOT inherit into a location that declares its own
# add_header. Every location that sets Cache-Control therefore re-includes this
# file. Add a location with its own add_header and you must include this too.
#
# The /api/ location deliberately does NOT include this file: those responses
# are JSON and carry helmet's headers from the API instead. Two
# Content-Security-Policy headers on one response are intersected by the
# browser, which produces confusing breakage.

# This app loads nothing from anywhere else, so the policy can be strict.
# connect-src is 'self' only because the API is same-origin through the proxy
# below - there is no third-party host to allow.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# HSTS stays commented out: over plain http://localhost it does nothing, and
# enabling it there pins localhost to HTTPS for every other project on your
# machine. Uncomment only behind real TLS on a real domain.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
