<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Quest — Learn to Code by Playing</title>
<style>
:root{--bg:#0e1126;--bg2:#151a3a;--panel:#1b2148;--panel2:#232b5e;--ink:#eef0ff;--mute:#a3abd6;--acc:#ffd23f;--good:#3ddc97;--bad:#ff5d73;--pri:#7c5cff;--cyan:#35d0ff;--w:#7c5cff}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(1200px 700px at 15% -10%,#2a2f78 0%,transparent 60%),radial-gradient(900px 600px at 100% 0%,#4a1f78 0%,transparent 55%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;color:inherit}
code,pre,textarea.editor,.cl{font-family:ui-monospace,"Cascadia Code","Fira Code",Menlo,Consolas,monospace}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;background:rgba(14,17,38,.88);backdrop-filter:blur(8px);border-bottom:1px solid #ffffff14;flex-wrap:wrap}
.logo{font-weight:900;font-size:20px;letter-spacing:.3px;cursor:pointer;background:linear-gradient(90deg,var(--acc),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.xp{flex:1;min-width:180px;max-width:420px}
.xp .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:3px}
.bar{height:10px;background:#ffffff14;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--good),var(--cyan));border-radius:99px;transition:width .6s}
.chips{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap}
.chip{background:var(--panel);padding:6px 11px;border-radius:99px;font-size:14px;font-weight:700;white-space:nowrap}
.chip.btn:hover{background:var(--panel2)}
main{max-width:900px;margin:0 auto;padding:22px 16px 80px}
h1,h2,h3{margin:.2em 0 .4em}
.hero{display:flex;gap:18px;align-items:center;background:linear-gradient(135deg,var(--panel),var(--panel2));padding:20px;border-radius:20px;margin-bottom:22px;border:1px solid #ffffff14}
.hero .bit{font-size:64px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
.hero p{margin:.3em 0;color:var(--mute);line-height:1.5}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.world{position:relative;background:var(--panel);border:2px solid color-mix(in srgb,var(--w) 55%,transparent);border-radius:18px;padding:16px;text-align:left;transition:transform .15s,box-shadow .15s;overflow:hidden}
.world:not(.locked):hover{transform:translateY(-4px);box-shadow:0 10px 30px color-mix(in srgb,var(--w) 40%,transparent)}
.world .num{position:absolute;right:12px;top:8px;font-size:44px;font-weight:900;opacity:.09}
.world .em{font-size:38px}
.world h3{color:var(--w);margin:.3em 0 .1em}
.world p{margin:0 0 10px;color:var(--mute);font-size:13.5px;line-height:1.4}
.world .meta{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;color:var(--mute)}
.world .st{color:var(--acc);letter-spacing:2px}
.world.locked{opacity:.5;filter:grayscale(.7);cursor:not-allowed}
.world.next{animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--w) 30%,transparent)}}
.card{background:var(--panel);border:1px solid #ffffff14;border-radius:20px;padding:22px;margin-bottom:16px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.wtitle{font-weight:800;color:var(--w);flex:1;text-align:center}
.ghost{background:#ffffff12;padding:8px 14px;border-radius:12px;font-size:14px}
.ghost:hover{background:#ffffff22}
.pri{background:linear-gradient(135deg,var(--pri),#a45cff);padding:11px 20px;border-radius:14px;font-weight:800;box-shadow:0 4px 0 #4b36b3}
.pri:active{transform:translateY(3px);box-shadow:0 1px 0 #4b36b3}
.pri.go{background:linear-gradient(135deg,#22c58a,#3ddc97);box-shadow:0 4px 0 #168a5f;color:#06251b}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.grow{flex:1}
.dots,.pips{display:flex;gap:6px;justify-content:center;margin:6px 0 14px}
.dots i,.pips i{width:34px;height:8px;border-radius:9px;background:#ffffff1c}
.dots i.cur,.pips i.cur{background:var(--w)}
.dots i.ok,.pips i.ok{background:var(--good)}
.real{background:color-mix(in srgb,var(--w) 16%,transparent);border-left:5px solid var(--w);padding:12px 14px;border-radius:12px;margin:12px 0;line-height:1.55}
.card p{line-height:1.6;color:#dfe3ff}
.codebox{background:#0a0d22;border:1px solid #ffffff1a;border-radius:14px;padding:8px 0;margin:12px 0;overflow-x:auto}
.cl{display:flex;gap:12px;padding:5px 14px;font-size:15px;cursor:pointer;white-space:pre;border-left:4px solid transparent}
.cl:hover{background:#ffffff0d}
.cl.on{background:color-mix(in srgb,var(--w) 25%,transparent);border-left-color:var(--w)}
.ln{color:#5d6699;user-select:none;min-width:14px;text-align:right}
pre.code{background:#0a0d22;border:1px solid #ffffff1a;border-radius:14px;padding:14px 16px;overflow-x:auto;font-size:15px;line-height:1.5;margin:12px 0}
.k{color:#ff79c6}.s{color:#f1fa8c}.n{color:#bd93f9}.c{color:#6f7aa8;font-style:italic}
.explain{display:flex;gap:12px;background:#ffffff0d;border-radius:14px;padding:14px;align-items:flex-start;line-height:1.55;min-height:70px}
.explain .bit-s{font-size:30px}
.explain code,.card li code,.card p code,.opt code,.real code,.hint code,.fb code,h2 code{background:#ffffff1a;padding:1px 6px;border-radius:6px;font-size:.92em}
.tip{margin-top:12px;background:#ff5d731a;border-left:5px solid var(--bad);padding:10px 14px;border-radius:10px;line-height:1.5}
details{margin-top:14px;background:#ffffff0a;border-radius:14px;padding:10px 14px}
summary{cursor:pointer;font-weight:700;color:var(--cyan)}
textarea{width:100%;background:#0a0d22;color:var(--ink);border:1px solid #ffffff22;border-radius:12px;padding:12px;font-size:15px;resize:vertical}
textarea.editor{min-height:150px;line-height:1.5;tab-size:2}
textarea:focus{outline:2px solid var(--w)}
pre.out{background:#04060f;border-radius:12px;padding:10px 14px;min-height:20px;color:#9bffcf;font-size:14px;white-space:pre-wrap;margin:8px 0 0}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tag{font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;background:#ffffff14;letter-spacing:.4px}
.tag.boss{background:linear-gradient(90deg,#ff5d73,#ff9a3d);color:#2b0610}
.tag.bug{background:#ff9a3d;color:#2b1700}
.tag.pts{color:var(--acc)}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{background:var(--panel2);padding:14px 16px;border-radius:14px;text-align:left;font-size:16px;border:2px solid transparent;font-family:ui-monospace,Menlo,Consolas,monospace}
.opt:hover:not(:disabled){border-color:var(--w);transform:translateX(4px)}
.opt:disabled{opacity:.55}
.opt.bad{background:#ff5d7333;border-color:var(--bad)}
.opt.good{background:#3ddc9733;border-color:var(--good);opacity:1}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.fb{margin-top:16px;padding:16px;border-radius:14px;line-height:1.6;animation:pop .35s}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.fb.good{background:#3ddc9722;border:2px solid var(--good)}
.fb.bad{background:#ff5d7322;border:2px solid var(--bad)}
.fb.info{background:#35d0ff1c;border:2px solid var(--cyan)}
.fb h3{margin:0 0 6px}
.bigpts{font-size:30px;font-weight:900;color:var(--acc)}
.hint{margin-top:12px;background:#ffd23f1c;border:2px dashed var(--acc);padding:12px;border-radius:12px;line-height:1.5}
.tests{margin-top:12px;display:grid;gap:6px}
.t{padding:8px 12px;border-radius:10px;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace}
.t.p{background:#3ddc9720}.t.f{background:#ff5d7326}
.result{text-align:center}
.bigstars{font-size:64px;color:var(--acc);letter-spacing:8px;animation:pop .6s}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.stat{background:#ffffff10;padding:12px 18px;border-radius:14px}
.stat b{display:block;font-size:24px;color:var(--acc)}
.learned{text-align:left;background:#ffffff0a;border-radius:14px;padding:12px 18px;margin-top:10px}
.learned li{margin:6px 0;line-height:1.5}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:100;display:grid;gap:8px}
.toast{background:linear-gradient(135deg,#ffd23f,#ff9a3d);color:#2b1700;padding:12px 20px;border-radius:14px;font-weight:800;box-shadow:0 10px 30px #0008;animation:drop .4s}
@keyframes drop{from{transform:translateY(-30px);opacity:0}}
#modal{position:fixed;inset:0;background:#000a;z-index:95;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal .box{background:var(--panel);border-radius:20px;padding:22px;max-width:560px;width:100%;max-height:85vh;overflow:auto}
.badge{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;background:#ffffff0c;margin:8px 0}
.badge .e{font-size:30px}
.badge.lock{opacity:.4;filter:grayscale(1)}
.badge small{color:var(--mute)}
.combo{display:inline-block;background:linear-gradient(90deg,#ff5d73,#ff9a3d);color:#2b0610;font-weight:900;padding:3px 10px;border-radius:99px;margin-left:8px;font-size:14px}
@media(max-width:560px){.hero{flex-direction:column;text-align:center}.cl{font-size:13px}}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="G.home()">🎮 Code Quest</div>
  <div class="xp"><div class="lab"><span id="rank">Rookie</span><span id="xpn"></span></div><div class="bar"><i id="xpbar"></i></div></div>
  <div class="chips">
    <span class="chip" title="Correct-answer streak">🔥 <span id="streak">0</span></span>
    <span class="chip" title="Total score">🏆 <span id="score">0</span></span>
    <span class="chip" title="Stars">⭐ <span id="stars">0</span></span>
    <button class="chip btn" onclick="G.badges()" title="Badges">🏅</button>
    <button class="chip btn" id="snd" onclick="G.sound()" title="Sound">🔊</button>
  </div>
</header>
<main id="app"></main>
<canvas id="fx"></canvas>
<div id="toast"></div>
<div id="modal" onclick="if(event.target===this)G.closeModal()"><div class="box" id="mbox"></div></div>

<script>
/* =========================================================
   CODE QUEST — learn JavaScript by playing
   Sections: 1) helpers  2) sandbox runner  3) game data
             4) game engine  5) screens
   ========================================================= */

/* ---------- 1) helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const L = (...a) => a.join('\n');
const pick = a => a[Math.floor(Math.random()*a.length)];

// tiny syntax highlighter (keywords / strings / numbers / comments)
function hl(code){
  const re = /(\/\/.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)|\b(let|const|function|return|if|else|for|while|of|true|false|new|typeof)\b|\b(\d+(?:\.\d+)?)\b/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const cls = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'k' : 'n';
    out += '<span class="'+cls+'">'+esc(m[0])+'</span>';
    last = m.index + m[0].length;
  }
  return out + esc(code.slice(last));
}

/* ---------- 2) sandbox: run the player's code safely ---------- */
// execute() is stringified into a Web Worker, so it must be self-contained.
function execute(code, exprs){
  var logs = [];
  function insp(v, top){
    if (typeof v === 'string') return top ? v : "'" + v + "'";
    if (Array.isArray(v)) return v.length ? '[ ' + v.map(function(x){return insp(x)}).join(', ') + ' ]' : '[]';
    if (v && typeof v === 'object'){ var k = Object.keys(v); return k.length ? '{ ' + k.map(function(x){return x + ': ' + insp(v[x])}).join(', ') + ' }' : '{}'; }
    return String(v);
  }
  function sortK(v){
    if (Array.isArray(v)) return v.map(sortK);
    if (v && typeof v === 'object'){ var o = {}; Object.keys(v).sort().forEach(function(k){ o[k] = sortK(v[k]); }); return o; }
    return v;
  }
  function ser(v){ if (v === undefined) return 'undefined'; if (typeof v === 'number' && isNaN(v)) return 'NaN'; return JSON.stringify(sortK(v)); }
  var fake = { log: function(){ logs.push([].map.call(arguments, function(a){ return insp(a, true); }).join(' ')); } };
  var res = [], error = null;
  try {
    var body = code + '\n;return [' + exprs.map(function(x){ return '(function(){try{return {v:(' + x + ')}}catch(e){return {e:String(e)}}})()'; }).join(',') + '];';
    var out = new Function('console', body)(fake);
    res = out.map(function(o){ return o.e ? { err: o.e } : { got: ser(o.v) }; });
  } catch (e) { error = String(e); }
  return { logs: logs, res: res, error: error };
}
const WORKER_SRC = 'var execute=' + execute.toString() + ';self.onmessage=function(e){postMessage(execute(e.data.code,e.data.exprs))};';
function runCode(code, exprs = []){
  return new Promise(resolve => {
    let w;
    try { w = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], {type:'text/javascript'}))); }
    catch (e) { return resolve(execute(code, exprs)); }          // fallback: run inline
    const t = setTimeout(() => { w.terminate(); resolve({logs:[], res:[], error:'⏱️ Your code ran for too long. Is there a loop that never stops?'}); }, 2000);
    w.onmessage = e => { clearTimeout(t); w.terminate(); resolve(e.data); };
    w.onerror = () => { clearTimeout(t); w.terminate(); resolve(execute(code, exprs)); };
    w.postMessage({ code, exprs });
  });
}
const sortK = v => Array.isArray(v) ? v.map(sortK) : (v && typeof v === 'object') ? Object.keys(v).sort().reduce((o,k)=>(o[k]=sortK(v[k]),o),{}) : v;
const ser = v => v === undefined ? 'undefined' : JSON.stringify(sortK(v));
const norm = s => String(s).toLowerCase().replace(/[\s,'"]/g, '');

/* ---------- 3) game data: 7 worlds ---------- */
const WORLDS = [
/* ======================= WORLD 1 ======================= */
{ id:'vars', name:'Variable Village', emoji:'📦', c:'#35d0ff',
  tag:'Store things in labeled boxes',
  story:"Welcome to Variable Village, where every villager keeps their belongings in labeled boxes. Learn to make, fill and change them!",
  learned:['A <b>variable</b> is a labeled box: <code>let name = value;</code>','<code>=</code> means &ldquo;put inside&rdquo;, not &ldquo;equals&rdquo;','Types: number, string (text in quotes), boolean (true/false)','<code>const</code> = a box you can never swap; <code>let</code> = a box you can change','Template strings glue values into text: <code>`Hi ${name}`</code>'],
  lessons:[
   { t:'Variables are labeled boxes 📦',
     real:"Your phone&rsquo;s contacts! Each contact has a <b>name</b> (the label) and a <b>number</b> (what is inside). You never memorize the digits &mdash; you just say &ldquo;Call Mom&rdquo;. A variable works the same way: a name that points to a value, so you can use it again and again.",
     text:"A <b>variable</b> is a named box in your computer&rsquo;s memory. You choose the name, put a value inside, and can read or change it later. Click each line to see what it does.",
     code:[
      ['let playerName = "Sam";','<b>let</b> is the magic word that means &ldquo;create a new box&rdquo;. <b>playerName</b> is the label you stick on it (no spaces allowed!). The single <b>=</b> means &ldquo;put this inside&rdquo; &mdash; it is <i>not</i> the maths &ldquo;equals&rdquo;. <b>&quot;Sam&quot;</b> is the value; the quote marks tell JavaScript it is text.'],
      ['let score = 0;','Another box, labeled <b>score</b>, holding the number <b>0</b>. Numbers have no quotes. The semicolon <b>;</b> is a full stop: it ends the instruction.'],
      ['score = score + 10;','No <b>let</b> this time &mdash; the box already exists, so we only change what is inside. The computer solves the <i>right side first</i>: read score (0), add 10, get 10. Then it puts 10 back into score. Like a game wallet: same wallet, more coins.'],
      ['console.log(playerName + " has " + score + " points");','<b>console.log(...)</b> is how the computer talks to you &mdash; it prints on screen. The <b>+</b> between text pieces glues them together (programmers call this <i>concatenation</i>). It prints: <code>Sam has 10 points</code>.']],
     tip:"<b>Common mistake:</b> using <code>let</code> twice for the same name. <code>let score</code> creates the box — after that, just write <code>score = ...</code>. Also name boxes clearly: <code>score</code> beats <code>x</code>, and <code>playerName</code> (camelCase) beats <code>player name</code>." },
   { t:'Types: what kind of thing is inside? 🧪',
     real:"A kitchen has different containers: a jar for sugar, a bottle for water, a switch for the light. Not everything fits everywhere! Values have <b>types</b> too: <b>numbers</b>, <b>strings</b> (text) and <b>booleans</b> (only yes/no).",
     text:"JavaScript treats a number, a piece of text, and a true/false value differently. There is also <b>const</b>: a box you promise never to swap.",
     code:[
      ['const birthYear = 2000;','<b>const</b> is like writing the label in permanent marker: this box can never be given a new value. Perfect for things that never change, like a birth year.'],
      ['let price = 4.5;','Numbers can have decimals. Still a number &mdash; no quotes.'],
      ['let item = "coffee";','Anything inside quotes is a <b>string</b> (text): names, sentences, emojis, even <code>"123"</code>.'],
      ['let isOpen = true;','A <b>boolean</b> has only two possible values: <b>true</b> or <b>false</b> (no quotes!). Think of a light switch: on or off. Great for questions like &ldquo;is the shop open?&rdquo;.'],
      ['console.log(typeof item);','<b>typeof</b> asks &ldquo;what type is this?&rdquo;. It prints <code>string</code>. Handy detective tool when something behaves strangely.']],
     tip:"<b>Sneaky one:</b> <code>5</code> (number) and <code>&quot;5&quot;</code> (text) look alike but behave very differently. You will see why in the Math Market!" },
   { t:'Template strings: fill-in-the-blank text ✍️',
     real:"Remember <b>Mad Libs</b>? A sentence with blanks you fill in. Template strings are exactly that: a sentence with <b>pockets</b> where variables get dropped in.",
     text:"Gluing text with <code>+</code> gets messy. Backticks and <code>${ }</code> are cleaner.",
     code:[
      ['let name = "Ada";','A text box labeled <b>name</b>.'],
      ['let level = 3;','A number box labeled <b>level</b>.'],
      ['let msg = `${name} reached level ${level}!`;','Backticks <b>` `</b> (the key above Tab) start a template string. Anything inside <b>${ }</b> is a pocket: JavaScript runs what is inside and drops the result into the sentence. Pocket 1 becomes Ada, pocket 2 becomes 3.'],
      ['console.log(msg);','Prints <code>Ada reached level 3!</code>. Change <b>level</b> to 4 and the message updates itself &mdash; that is the power of variables!']],
     tip:"<b>Common mistake:</b> using normal quotes <code>&quot; &quot;</code> instead of backticks. <code>${ }</code> only works inside backticks." }
  ],
  ch:[
   { type:'quiz', q:"Which line creates a box called <code>lives</code> and puts the number 3 inside?",
     o:['let lives = 3;','make lives to 3','3 = lives;','lives := 3'], a:0,
     hint:"Remember the magic word that creates a new box.",
     why:"<code>let</code> creates the box, <code>lives</code> is the label, <code>=</code> means &ldquo;put inside&rdquo;, and <code>3</code> is the value. The other options come from other languages or are just nonsense &mdash; JavaScript only understands <code>let</code> (or <code>const</code>) for new boxes." },
   { type:'output', q:"What does this code print?", code:L('let coins = 5;','coins = coins + 2;','console.log(coins);'), answer:'7',
     hint:"Solve the right side of the = first, then store it back.",
     why:"The box starts with 5. In line 2 the computer reads the box (5), adds 2 → 7, and puts 7 back. Real life: you have 5 coins in your pocket and a friend gives you 2 more. Still one pocket, now with 7 coins." },
   { type:'quiz', q:"Which of these is a <b>string</b> (text)?", o:['42','"42"','true','4.2'], a:1,
     hint:"Look for the quote marks.",
     why:"Quotes turn anything into text, even digits. <code>42</code> is a number, <code>true</code> is a boolean, <code>4.2</code> is a decimal number. <code>&quot;42&quot;</code> is text that happens to contain digits &mdash; like a house number written on a door: you read it, you don&rsquo;t do maths with it." },
   { type:'code', q:"You have <code>gold</code> = 50. Add 25 more gold <b>to the same variable</b>.",
     starter:L('let gold = 50;','// add 25 to gold on the next line'),
     tests:[['gold',75]], solution:L('let gold = 50;','gold = gold + 25;'), pts:25,
     hint:"No <code>let</code> this time &mdash; the box exists already. Read gold, add 25, store it back into gold.",
     why:"<code>gold = gold + 25;</code> reads the current value (50), adds 25, and stores 75 back in the same box. If you wrote <code>let gold</code> again, JavaScript would complain: you can&rsquo;t build a second box with the same label!" },
   { type:'code', boss:true, q:"👹 <b>BOSS:</b> Variables <code>name</code> and <code>level</code> exist. Make a variable <code>message</code> that equals exactly <code>Ada reached level 3!</code> using a <b>template string</b> (backticks and <code>${ }</code>).",
     starter:L('let name = "Ada";','let level = 3;','// your line: let message = ...'),
     tests:[['message','Ada reached level 3!']],
     solution:L('let name = "Ada";','let level = 3;','let message = `${name} reached level ${level}!`;'), pts:30,
     hint:"Start with a backtick, put <code>${name}</code>, type the words, then <code>${level}</code> and the <code>!</code>. End with a backtick.",

{ id:'func', name:'Function Factory', emoji:'🏭', c:'#3ddc97',
  tag:'Build reusable machines',
  story:"Welcome to the Function Factory! Instead of doing the same job again and again, you build a <b>machine</b> once and press its button whenever you like.",
  learned:['A <b>function</b> is a reusable machine: <code>function name(input) { ... }</code>','<b>Parameters</b> are the inputs; <b>arguments</b> are the values you pass in','<code>return</code> hands a value back; <code>console.log</code> only shows it','Write once, reuse everywhere (no copy-paste!)'],
  lessons:[
   { t:'A function is a machine ⚙️',
     real:"A <b>vending machine</b>: you put in coins and press a button (inputs), the machine does its work inside (the body), and a snack drops out (the return value). You do not need to know how the machine works to use it!",
     text:"A function packages instructions under a name. <b>Defining</b> a function builds the machine; <b>calling</b> it runs the machine.",
     code:[
      ['function double(number) {','<b>function</b> says &ldquo;I am building a machine&rdquo;. <b>double</b> is its name. Inside the brackets is the <b>parameter</b> <code>number</code> &mdash; an empty slot waiting for an input. The <b>{</b> opens the machine&rsquo;s body.'],
      ['  return number * 2;','<b>return</b> sends a value <i>out</i> of the machine and stops it. Here we take whatever came in and multiply it by 2. (Indentation is just to make it readable.)'],
      ['}','Closes the body. Nothing has run yet &mdash; we just built the machine!'],
      ['let result = double(4);','This is the <b>call</b>: we press the button with input <b>4</b>. The 4 drops into <code>number</code>, the body runs, 4 * 2 = 8 is returned, and 8 lands in <b>result</b>.'],
      ['console.log(result);','Prints <code>8</code>.']],
     tip:"<b>Common mistake:</b> defining the function and forgetting to call it. Building a vending machine does not give you a snack &mdash; you have to press the button: <code>double(4)</code>." },
   { t:'return vs console.log 🎁',
     real:"A vending machine has a <b>screen</b> (&ldquo;Enjoy your snack!&rdquo;) and a <b>tray</b> where the snack falls. <code>console.log</code> is the screen: a message for the human. <code>return</code> is the tray: the actual thing you can use afterwards.",
     text:"This is the #1 thing beginners mix up. Read the code and predict the output!",
     code:[
      ['function addTax(price) {','A machine with one input.'],
      ['  return price + 2;','Gives the answer back to whoever called it.'],
      ['}','End of addTax.'],
      ['function shout(word) {','A machine that only <i>displays</i> something...'],
      ['  console.log(word + "!");','...it prints to the screen but never uses <b>return</b>.'],
      ['}','End of shout.'],
      ['let a = addTax(10);','10 + 2 = 12 comes back through <b>return</b> and is stored in <b>a</b>.'],
      ['let b = shout("hey");','Prints <code>hey!</code> on screen. But nothing was returned, so <b>b</b> becomes <code>undefined</code> (JavaScript&rsquo;s word for &ldquo;nothing here&rdquo;).'],
      ['console.log(a, b);','Prints <code>12 undefined</code>.']],
     tip:"<b>Rule of thumb:</b> if you want to <i>use</i> the answer later (store it, add to it, compare it), <code>return</code> it. Use <code>console.log</code> only to peek at values while you work." },
   { t:'Many inputs, endless reuse ♻️',
     real:"A cooking recipe: &ldquo;pizza for N people&rdquo;. Write the recipe once and use it for 2 friends or 200 guests. Functions stop you from copy-pasting the same code over and over.",
     text:"Functions can take <b>several</b> parameters, separated by commas. The values you pass in are called <b>arguments</b>; they fill the parameters <i>in order</i>.",
     code:[
      ['function area(width, height) {','Two slots: <b>width</b> and <b>height</b>.'],
      ['  return width * height;','Multiply the two inputs and send the result out.'],
      ['}','End of the machine.'],
      ['console.log(area(3, 4));','First argument 3 → width, second 4 → height. 3 × 4 = <code>12</code>.'],
      ['console.log(area(10, 2));','Same machine, new inputs: <code>20</code>. No copy-paste needed!']],
     tip:"<b>Order matters:</b> <code>area(3, 4)</code> puts 3 in the first slot and 4 in the second. With subtraction, <code>sub(10, 3)</code> and <code>sub(3, 10)</code> give different answers!" }
  ],
  ch:[
   { type:'quiz', q:"What does <code>double(4)</code> give back?", code:L('function double(n) {','  return n * 2;','}'), o:['4','8','n * 2','undefined'], a:1,
     hint:"The 4 goes into <code>n</code>, then <code>n * 2</code> is calculated.",
     why:"Calling <code>double(4)</code> drops 4 into the parameter <code>n</code>. The body computes 4 * 2 = 8 and <code>return</code> sends 8 back to the caller." },
   { type:'quiz', q:"What is the difference between <code>return</code> and <code>console.log</code>?",
     o:['return sends a value back to the code that called the function; console.log only shows it on screen','They are exactly the same','console.log stops the function; return prints','return only works with numbers'], a:0,

   { type:'output', q:"What does this code print?", code:L('function add(a, b) {','  return a + b;','}','console.log(add(2, 3) * 2);'), answer:'10',
     hint:"Work from the inside out: add(2, 3) first.",

   { type:'code', q:"Finish the function <code>double(n)</code> so it <b>returns</b> twice the number.",
     starter:L('function double(n) {','  // your code','}'),

     why:"Our tests call the function with 3 different inputs, and the same one-line body handles all of them &mdash; that is what makes functions powerful. Even 0 and negative numbers just work." },
   { type:'code', bug:true, q:"🐛 <b>Bug hunt:</b> <code>greet(name)</code> should <b>return</b> <code>Hello Ada</code> for <code>&quot;Ada&quot;</code>, but it only prints it. Fix it!",

     solution:L('function average(a, b, c) {','  return (a + b + c) / 3;','}'), pts:30,
     hint:"Add all three, then divide by 3. Careful with the brackets!",

{ id:'if', name:'Decision Dungeon', emoji:'🚪', c:'#ff9a3d',

  learned:['Comparisons give <b>true/false</b>: <code>&gt; &lt; &gt;= &lt;= === !==</code>','<code>=</code> stores, <code>===</code> compares','<code>if / else if / else</code> checks top to bottom &mdash; <b>first true wins</b>','<code>&amp;&amp;</code> = AND, <code>||</code> = OR, <code>!</code> = NOT'],
  lessons:[
   { t:'Questions with yes/no answers ❓',

     code:[

      ['console.log(age === 16);','<b>===</b> asks &ldquo;is it exactly equal?&rdquo;. Yes → <code>true</code>. Three equals signs, because one <b>=</b> already means &ldquo;store&rdquo;!'],
      ['console.log(age !== 16);','<b>!==</b> means &ldquo;not equal&rdquo;. It is 16, so → <code>false</code>.'],

     tip:"<b>Classic bug:</b> writing <code>if (age = 18)</code> (one =) <i>stores</i> 18 instead of asking a question. Always use <code>===</code> to compare." },
   { t:'if / else if / else 🚦',
     real:"Deciding what to wear: <i>if</i> it is hot → shorts, <i>else if</i> it is mild → jacket, <i>else</i> → coat. You check the conditions in order and stop at the first one that is true.",
     text:"<code>if</code> runs a block of code only when its condition is true.",
     code:[
      ['let temperature = 12;','Today it is 12 degrees.'],
      ['if (temperature > 25) {','Question 1: is it hotter than 25? 12 &gt; 25 is false → skip the block.'],

      ['} else if (temperature > 10) {','Question 2: hotter than 10? <b>Yes</b> → run this block, then skip everything else.'],
      ['  console.log("Wear a jacket");','This is the one that prints!'],
      ['} else {','<b>else</b> = &ldquo;none of the above&rdquo; (the safety net).'],

     tip:"<b>Order matters!</b> JavaScript stops at the <i>first</i> true condition. If you ask <code>temperature &gt; 10</code> before <code>temperature &gt; 25</code>, a 30° day would say &ldquo;jacket&rdquo;." },
   { t:'AND, OR, NOT: combining questions 🎢',

     text:"<code>&amp;&amp;</code> (AND), <code>||</code> (OR) and <code>!</code> (NOT) combine or flip booleans.",
     code:[

      ['let freeEntry = age < 5 || age > 65;','<b>||</b> (OR) is true if <i>at least one</i> side is true. 10 &lt; 5 is false, 10 &gt; 65 is false → <code>false</code>.'],

   { type:'output', q:"What does this code print?", code:L('let age = 15;','if (age >= 18) {','  console.log("adult");','} else {','  console.log("minor");','}'), answer:'minor',
     hint:"Is 15 &gt;= 18?",

     hint:"Even numbers leave remainder 0 when divided by 2. A comparison already gives true/false &mdash; you can return it directly.",

   { type:'code', bug:true, q:"🐛 <b>Bug hunt:</b> <code>grade(score)</code> should give A for 90+, B for 80+, C for 70+, else F. But 95 returns &ldquo;C&rdquo;. Fix the bug!",

  story:"The tide goes in, the tide goes out, never a doubt. In Loop Lagoon you will teach your code to repeat tasks 10, 1000 or a million times.",

  lessons:[
   { t:'The for loop 🏃',

     text:"A loop repeats a block of code. A <code>for</code> loop is perfect when you know how many times.",
     code:[
      ['for (let i = 1; i <= 3; i++) {','Three parts inside the brackets: <b>(1) let i = 1</b> &mdash; start counting at 1 (<b>i</b> is the lap counter). <b>(2) i &lt;= 3</b> &mdash; keep going while this is true. <b>(3) i++</b> &mdash; after each lap add 1 to i.'],
      ['  console.log("Lap " + i);','The body. Runs once per lap: &ldquo;Lap 1&rdquo;, &ldquo;Lap 2&rdquo;, &ldquo;Lap 3&rdquo;.'],
      ['}','After the body: do the step (i++), test again. When i becomes 4, 4 &lt;= 3 is false → the loop ends.']],

  if (!worldDone(w)) return 0;
  const m = WORLDS[w].ch.reduce((a,_,i)=>{ const b=bestOf(w,i); return a + b.wrong + b.hints + (b.sol?3:0); }, 0);
  return m<=1 ? 3 : m<=4 ? 2 : 1;
}
const totalStars = () => WORLDS.reduce((a,_,i)=>a+stars(i),0);
const basePts = c => (c.pts || (c.type==='quiz'?10:c.type==='output'?15:25)) * (c.boss?2:1);
const comboMult = n => n>=6 ? 2 : n>=3 ? 1.5 : 1;
const PER_LEVEL = 90;

function header(){
  const s = total(), lv = Math.floor(s/PER_LEVEL)+1;
  $('#rank').textContent = 'Lv ' + lv + ' · ' + RANKS[Math.min(RANKS.length-1, Math.floor((lv-1)/2))];
  $('#xpn').textContent = (s % PER_LEVEL) + ' / ' + PER_LEVEL + ' XP';
  $('#xpbar').style.width = ((s % PER_LEVEL)/PER_LEVEL*100) + '%';
  $('#score').textContent = s; $('#stars').textContent = totalStars(); $('#streak').textContent = streak;
  $('#snd').textContent = SV.sound ? '🔊' : '🔇';
}

// --- sound (WebAudio, no files needed) ---
let AC;
function sfx(kind){
  if (!SV.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const seq = { ok:[[523,.09],[659,.09],[784,.16]], bad:[[220,.14],[165,.2]], win:[[523,.1],[659,.1],[784,.1],[1047,.3]], tick:[[660,.05]], badge:[[784,.1],[988,.1],[1319,.25]] }[kind] || [];
    let t = AC.currentTime;
    seq.forEach(([f,d]) => { const o=AC.createOscillator(), g=AC.createGain(); o.type = kind==='bad'?'sawtooth':'triangle'; o.frequency.value=f; g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d); t+=d*.9; });
  } catch(e){}
}
// --- confetti ---
function confetti(n=90){
  const cv = $('#fx'), cx = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#ffd23f','#3ddc97','#35d0ff','#ff5d73','#a45cff','#ff9a3d'];
  const ps = Array.from({length:n}, () => ({x:innerWidth/2+(Math.random()-.5)*200, y:innerHeight*.35, vx:(Math.random()-.5)*14, vy:-Math.random()*13-3, s:5+Math.random()*7, c:pick(cols), r:Math.random()*6, vr:(Math.random()-.5)*.4}));
  (function f(){
    cx.clearRect(0,0,cv.width,cv.height); let alive=false;
    ps.forEach(p => { p.vy+=.45; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; if(p.y<cv.height+20) alive=true; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); cx.restore(); });
    if (alive) requestAnimationFrame(f); else cx.clearRect(0,0,cv.width,cv.height);
  })();
}
function toast(html){ const t=document.createElement('div'); t.className='toast'; t.innerHTML=html; $('#toast').appendChild(t); setTimeout(()=>t.remove(), 3800); }
function checkBadges(){
  BADGES.forEach(b => { if (!SV.badges.includes(b.id) && b.t()) { SV.badges.push(b.id); toast(b.e + ' New badge: ' + b.n + '!'); sfx('badge'); } });
  save();
}

/* ---------- 5) screens ---------- */
const app = $('#app');
const cur = () => WORLDS[S.w].ch[S.ch];
const setW = w => document.documentElement.style.setProperty('--w', WORLDS[w].c);

// ===== MAP / HOME =====
function home(){
  S = {}; document.documentElement.style.setProperty('--w', '#7c5cff'); header();
  const nextW = WORLDS.findIndex((_,i)=>!worldDone(i));
  const started = Object.keys(SV.best).length > 0;
  app.innerHTML = `
  <section class="hero">
    <div class="bit">🤖</div>
    <div>
      <h1>${started ? 'Welcome back, Coder!' : 'Hi! I am Bit, your coding buddy.'}</h1>
      <p>${nextW === -1 ? '🏆 You cleared every world! Replay any world to beat your best score and earn more stars.'
         : 'Each world teaches one big idea with <b>real-life examples</b>, explains code <b>line by line</b>, then lets you <b>play challenges</b> for points. Earn combos, collect stars &amp; badges, and unlock the next world!'}</p>
      ${nextW !== -1 ? `<button class="pri go" onclick="G.open(${nextW})">${started?'▶ Continue':'▶ Start your quest'}: ${WORLDS[nextW].emoji} ${WORLDS[nextW].name}</button>` : ''}
    </div>
  </section>
  <div class="map">${WORLDS.map((W,i)=>{
    const lock = !unlocked(i), s = stars(i);
    return `<button class="world ${lock?'locked':''} ${i===nextW?'next':''}" style="--w:${W.c}" ${lock?'':`onclick="G.open(${i})"`}>
      <span class="num">${i+1}</span><div class="em">${lock?'🔒':W.emoji}</div>
      <h3>${W.name}</h3><p>${lock?'Clear <b>'+WORLDS[i-1].name+'</b> to unlock':W.tag}</p>
      <div class="bar"><i style="width:${worldCount(i)/W.ch.length*100}%;background:${W.c}"></i></div>
      <div class="meta"><span>${worldCount(i)}/${W.ch.length} challenges</span><span class="st">${'★'.repeat(s)}${'☆'.repeat(3-s)}</span></div></button>`;
  }).join('')}</div>`;
}

// ===== LEARN =====
function learn(){
  const W = WORLDS[S.w], l = W.lessons[S.lesson]; setW(S.w); S.mode='learn'; S.line=-1; header();
  const n = W.lessons.length;
  app.innerHTML = `
  <div class="topbar"><button class="ghost" onclick="G.home()">← Map</button><div class="wtitle">${W.emoji} ${W.name}</div><button class="ghost" onclick="G.play()">⚔️ Skip to challenges</button></div>
  ${S.lesson===0 ? `<p style="text-align:center;color:var(--mute);margin:0 0 6px">${W.story}</p>`:''}
  <div class="dots">${W.lessons.map((_,i)=>`<i class="${i<S.lesson?'ok':i===S.lesson?'cur':''}"></i>`).join('')}</div>
  <div class="card">
    <div class="tags"><span class="tag">📖 LESSON ${S.lesson+1} / ${n}</span></div>
    <h2>${l.t}</h2>
    <div class="real">🌍 <b>Real-world picture:</b> ${l.real}</div>
    <p>${l.text}</p>
    <div class="codebox">${l.code.map((c,i)=>`<div class="cl" id="cl${i}" onclick="G.line(${i})"><span class="ln">${i+1}</span><code>${hl(c[0])||' '}</code></div>`).join('')}</div>
    <div class="explain"><div class="bit-s">🤖</div><div id="exptxt">Click any line of code (or press <b>Next line ▶</b>) and I will explain exactly what the computer does &mdash; step by step.</div></div>
    <div class="row"><button class="ghost" onclick="G.nextLine(-1)">◀ Previous line</button><button class="pri" onclick="G.nextLine(1)">Next line ▶</button></div>
    ${l.tip?`<div class="tip">⚠️ ${l.tip}</div>`:''}
    <details><summary>🧪 Try it yourself &mdash; edit the code and press Run!</summary>
      <textarea id="pg" class="editor" spellcheck="false" onkeydown="G.tab(event)">${esc(l.code.map(c=>c[0]).join('\n'))}</textarea>
      <div class="row"><button class="pri go" onclick="G.runPg()">▶ Run</button></div><pre class="out" id="pgout">(output appears here)</pre></details>
  </div>
  <div class="row"><button class="ghost" ${S.lesson===0?'disabled style="opacity:.4"':''} onclick="G.lessonGo(-1)">◀ Back</button><span class="grow"></span>
    ${S.lesson<n-1 ? `<button class="pri" onclick="G.lessonGo(1)">Next lesson ▶</button>` : `<button class="pri go" onclick="G.play()">⚔️ Start challenges!</button>`}</div>`;
  window.scrollTo(0,0);
}

// ===== CHALLENGES =====
function challenge(){
  const W = WORLDS[S.w], c = cur(); setW(S.w); S.mode='play'; header();
  Object.assign(S, {wrong:0, hints:0, done:false, sol:false, hintOn:false});
  const label = c.bug ? '🐛 BUG HUNT' : c.type==='quiz' ? '🧠 QUIZ' : c.type==='output' ? '🔮 PREDICT THE OUTPUT' : '⌨️ CODE IT';
  let body = '';
  if (c.type==='quiz') body = `<div class="opts">${c.o.map((o,i)=>`<button class="opt" id="o${i}" onclick="G.pick(${i})">${esc(o)}</button>`).join('')}</div>`;
  if (c.type==='output') body = `<textarea id="ans" rows="2" placeholder="Type exactly what gets printed…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();G.check()}"></textarea><div class="row"><button class="pri" id="chk" onclick="G.check()">Check ✔</button></div>`;
  if (c.type==='code') body = `<textarea id="ed" class="editor" spellcheck="false" onkeydown="G.tab(event)">${esc(c.starter)}</textarea><div class="row"><button class="pri" id="chk" onclick="G.check()">▶ Run tests</button><span style="color:var(--mute);font-size:13px">Ctrl/⌘ + Enter</span></div><div class="tests" id="tests"></div><pre class="out" id="cout" style="display:none"></pre>`;
  app.innerHTML = `
  <div class="topbar"><button class="ghost" onclick="G.home()">← Map</button><div class="wtitle">${W.emoji} ${W.name}</div><button class="ghost" onclick="G.learn()">📖 Lessons</button></div>
  <div class="pips">${W.ch.map((_,i)=>`<i class="${bestOf(S.w,i)&&i!==S.ch?'ok':i===S.ch?'cur':''}"></i>`).join('')}</div>
  <div class="card" id="card">
    <div class="tags"><span class="tag">${label}</span>${c.boss?'<span class="tag boss">BOSS · DOUBLE POINTS</span>':''}<span class="tag pts">⭐ up to ${basePts(c)} pts</span><span class="tag">${S.ch+1} / ${W.ch.length}</span></div>
    <h2>${c.q}</h2>
    ${c.code && c.type!=='code' ? `<pre class="code">${hl(c.code)}</pre>` : ''}
    ${body}
    <div id="hintbox"></div><div id="msg"></div>
    <div class="row" id="tools"><button class="ghost" id="hintBtn" onclick="G.hint()">💡 Hint (−5 pts)</button></div>
  </div>`;
  window.scrollTo(0,0);
  const ed = $('#ed'); if (ed) ed.addEventListener('keydown', e => { if ((e.ctrlKey||e.metaKey) && e.key==='Enter') G.check(); });
}

function wrongAnswer(extra=''){
  S.wrong++; streak = 0; header(); sfx('bad');
  $('#card').classList.remove('shake'); void $('#card').offsetWidth; $('#card').classList.add('shake');
  $('#msg').innerHTML = `<div class="fb bad"><h3>❌ ${pick(OOPS)}</h3>${extra}</div>`;
  if (S.wrong >= 3 && !S.done && !$('#solBtn')) $('#tools').insertAdjacentHTML('beforeend', `<button class="ghost" id="solBtn" onclick="G.solution()">🏳️ Show solution (0 pts)</button>`);
}
function solved(){
  S.done = true; const c = cur(), base = basePts(c);
  const raw = S.sol ? 0 : Math.max(Math.ceil(base*.3), base - 4*S.wrong - 5*S.hints);
  const clean = S.wrong===0 && !S.sol;
  if (clean) streak++; else if (S.sol) streak = 0;
  SV.bestStreak = Math.max(SV.bestStreak, streak);
  const mult = clean ? comboMult(streak) : 1, pts = Math.round(raw*mult);
  const k = WORLDS[S.w].id+':'+S.ch, old = SV.best[k];
  if (!old || pts >= old.pts) SV.best[k] = { pts, wrong:S.wrong, hints:S.hints, sol:S.sol };
  const first = !old;
  save(); header(); checkBadges();
  document.querySelectorAll('.opt,#chk,#ed,#ans,#hintBtn,#solBtn').forEach(e => e.disabled = true);
  const last = S.ch === WORLDS[S.w].ch.length-1;
  $('#msg').innerHTML = `<div class="fb ${S.sol?'info':'good'}">
    <h3>${S.sol ? '📘 Here is how it works' : '✅ ' + pick(CHEER)}</h3>
    ${S.sol ? '' : `<div class="bigpts">+${pts} pts ${mult>1?`<span class="combo">🔥 COMBO ×${mult}</span>`:''}</div>
    <small style="color:var(--mute)">${S.wrong||S.hints ? `(${S.wrong} mistake${S.wrong===1?'':'s'}, ${S.hints} hint${S.hints===1?'':'s'} used &mdash; do it clean for full points!)` : 'Perfect, no mistakes or hints!'}${first?'':' · replay: best score kept'}</small>`}
    <p><b>🧠 Why:</b> ${c.why}</p>
    ${S.sol && c.type==='code' ? `<pre class="code">${hl(c.solution)}</pre>` : ''}
    <div class="row"><span class="grow"></span><button class="pri go" onclick="G.next()">${last?'Finish world 🏁':'Next ▶'}</button></div></div>`;
  if (!S.sol) { sfx('ok'); confetti(c.boss ? 160 : 45); }
  $('#msg').scrollIntoView({behavior:'smooth', block:'center'});
}

// ===== RESULT =====
function result(){
  const W = WORLDS[S.w], st = stars(S.w), pts = W.ch.reduce((a,_,i)=>a+bestOf(S.w,i).pts,0);
  const mistakes = W.ch.reduce((a,_,i)=>a+bestOf(S.w,i).wrong,0);
  const allDone = WORLDS.every((_,i)=>worldDone(i)), nextOk = S.w < WORLDS.length-1;
  S.mode='result'; header(); checkBadges(); sfx('win'); confetti(220);
  app.innerHTML = `<div class="card result">
    <div class="bigstars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div>
    <h1>${allDone ? '🧙 You are a CODE WIZARD!' : W.emoji + ' ' + W.name + ' cleared!'}</h1>
    <p>${st===3 ? 'Flawless! Almost no mistakes.' : st===2 ? 'Great job! Replay for the 3rd star: fewer mistakes and hints.' : 'You finished it &mdash; that is what matters! Replay later to collect more stars.'}</p>
    <div class="stats"><div class="stat"><b>${pts}</b>world points</div><div class="stat"><b>${mistakes}</b>mistakes</div><div class="stat"><b>${total()}</b>total score</div></div>
    <div class="learned"><h3>🧠 What you learned</h3><ul>${W.learned.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    ${allDone ? `<div class="tip" style="border-color:var(--good);background:#3ddc9718;text-align:left">🎉 <b>You finished all 7 worlds!</b> You can now store data, make decisions, repeat actions, build functions, and model real things with arrays and objects &mdash; the core of <i>every</i> programming language. <b>Next steps:</b> build a tiny project (a to-do list, a quiz, a tip calculator), learn HTML &amp; CSS to make web pages, and keep replaying worlds for 3 stars.</div>` : ''}
    <div class="row" style="justify-content:center"><button class="ghost" onclick="G.open(${S.w},true)">🔁 Replay world</button><button class="ghost" onclick="G.home()">🗺️ Map</button>${nextOk?`<button class="pri go" onclick="G.open(${S.w+1})">Next world: ${WORLDS[S.w+1].emoji} ${WORLDS[S.w+1].name} ▶</button>`:''}</div>
  </div>`;
  window.scrollTo(0,0);
}

function badgesModal(){
  $('#mbox').innerHTML = `<h2>🏅 Badges (${SV.badges.length}/${BADGES.length})</h2>` + BADGES.map(b=>`<div class="badge ${SV.badges.includes(b.id)?'':'lock'}"><div class="e">${b.e}</div><div><b>${b.n}</b><br><small>${b.d}</small></div></div>`).join('') +
    `<div class="row"><button class="ghost" onclick="G.reset()">🗑️ Reset all progress</button><span class="grow"></span><button class="pri" onclick="G.closeModal()">Close</button></div>`;
  $('#modal').classList.add('on');
}

/* ----- public actions called from the page ----- */
const G = {
  home, learn,
  open(w, replay){ if(!unlocked(w)) return; S = {w, lesson:0, ch:0}; setW(w); if (replay) { S.ch=0; challenge(); } else learn(); },
  play(){ const W = WORLDS[S.w]; let i = W.ch.findIndex((_,j)=>!bestOf(S.w,j)); S.ch = i<0 ? 0 : i; challenge(); },
  lessonGo(d){ S.lesson += d; learn(); },
  line(i){
    S.line = i; const c = WORLDS[S.w].lessons[S.lesson].code;
    document.querySelectorAll('.cl').forEach((e,j)=>e.classList.toggle('on', j===i));
    $('#exptxt').innerHTML = `<b>Line ${i+1}:</b> <code>${esc(c[i][0].trim())}</code><br>${c[i][1]}`; sfx('tick');
  },
  nextLine(d){
    const c = WORLDS[S.w].lessons[S.lesson].code; let i = S.line;
    do { i += d; if (i >= c.length) i = 0; if (i < 0) i = c.length-1; } while (!c[i][1] && c.some(x=>x[1]));
    G.line(i);
  },
  async runPg(){ const r = await runCode($('#pg').value); $('#pgout').textContent = r.error ? '⚠️ ' + r.error : (r.logs.join('\n') || '(ran fine, but nothing was printed — use console.log!)'); },
  tab(e){ if (e.key==='Tab') { e.preventDefault(); const t=e.target, s=t.selectionStart; t.value = t.value.slice(0,s)+'  '+t.value.slice(t.selectionEnd); t.selectionStart=t.selectionEnd=s+2; } },
  hint(){
    if (S.hintOn || S.done) return; S.hintOn = true; S.hints++;
    $('#hintbox').innerHTML = `<div class="hint">💡 <b>Hint:</b> ${cur().hint}</div>`; $('#hintBtn').disabled = true;
  },
  pick(i){
    if (S.done) return; const c = cur(), b = $('#o'+i);
    if (i === c.a) { b.classList.add('good'); solved(); }
    else { b.classList.add('bad'); b.disabled = true; wrongAnswer('<p>That is not it. That option is now crossed out &mdash; try another one!</p>'); }
  },
  async check(){
    if (S.done) return; const c = cur();
    if (c.type === 'output') {
      const v = $('#ans').value; if (!v.trim()) return;
      if (norm(v) === norm(c.answer)) solved(); else wrongAnswer('<p>Trace the code line by line, like a detective. Tip: use the 💡 hint if you are stuck.</p>');
    } else if (c.type === 'code') {
      const code = $('#ed').value, r = await runCode(code, c.tests.map(t=>t[0]));
      const out = $('#cout'); out.style.display = r.logs.length ? 'block' : 'none'; out.textContent = r.logs.length ? 'console: ' + r.logs.join('\n') : '';
      if (r.error) return wrongAnswer(`<p>⚠️ <b>Error:</b> <code>${esc(r.error)}</code></p><p>Check brackets <code>( ) { }</code>, quotes and semicolons.</p>`);
      let pass = 0;
      $('#tests').innerHTML = c.tests.map((t,i) => {
        const got = r.res[i] && r.res[i].got, ok = got === ser(t[1]); if (ok) pass++;
        return `<div class="t ${ok?'p':'f'}">${ok?'✅':'❌'} <b>${esc(t[0])}</b> should be <b>${esc(ser(t[1]))}</b>${ok?'':' &mdash; got <b>'+esc(r.res[i] && r.res[i].err ? r.res[i].err : got)+'</b>'}</div>`;
      }).join('');
      if (pass === c.tests.length) solved(); else wrongAnswer(`<p><b>${pass} of ${c.tests.length}</b> tests passed. Read the red lines, they tell you exactly what went wrong.</p>`);
    }
  },
  solution(){
    const c = cur(); S.sol = true;
    if (c.type === 'code') $('#ed').value = c.solution;
    if (c.type === 'output') $('#ans').value = c.answer;
    solved();
  },
  next(){ if (S.ch < WORLDS[S.w].ch.length-1) { S.ch++; challenge(); } else result(); },
  badges: badgesModal,
  closeModal(){ $('#modal').classList.remove('on'); },
  sound(){ SV.sound = !SV.sound; save(); header(); sfx('ok'); },
  reset(){ if (confirm('Erase ALL progress, scores and badges?')) { SV = {best:{},badges:[],sound:true,bestStreak:0}; streak = 0; save(); G.closeModal(); home(); } }
};

/* ---------- self-test: proves every challenge is solvable (open the console and run __selfTest()) ---------- */
window.__selfTest = async function(){
  const bad = []; let n = 0;
  for (const W of WORLDS) for (const [i,c] of W.ch.entries()) {
    n++; const id = W.id+':'+(i+1);
    if (c.type==='quiz' && !(c.a>=0 && c.a<c.o.length)) bad.push(id+' bad answer index');
    if (c.type==='output') { const r = await runCode(c.code); if (norm(r.logs.join('\n')) !== norm(c.answer)) bad.push(id+' output mismatch: '+r.logs.join('|')); }
    if (c.type==='code') {
      const r = await runCode(c.solution, c.tests.map(t=>t[0]));
      if (r.error) bad.push(id+' solution error '+r.error);
      else c.tests.forEach((t,j)=>{ if (r.res[j].got !== ser(t[1])) bad.push(id+' solution fails test '+t[0]+' got '+r.res[j].got); });
      const s = await runCode(c.starter, c.tests.map(t=>t[0]));   // starter must NOT already pass
      if (!s.error && c.tests.every((t,j)=>s.res[j].got === ser(t[1]))) bad.push(id+' starter already passes!');
    }
    if (!c.hint || !c.why) bad.push(id+' missing hint/why');
  }
  for (const W of WORLDS) for (const [li,l] of W.lessons.entries()) { const r = await runCode(l.code.map(c=>c[0]).join('\n')); if (r.error) bad.push(W.id+' lesson '+(li+1)+' error '+r.error); }
  return { challenges:n, problems:bad };
};

home();
</script>
