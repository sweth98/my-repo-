<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Dharmakshetra — The Chariot of Partha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit:ital@0;1&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#120a1c;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;width:min(100vw,177.78vh);height:auto;aspect-ratio:16/9;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script>
"use strict";
/* ───────────────────────────────────────────────────────────────
   DHARMAKSHETRA — a small game of Kurukshetra
   You are Arjuna, Krishna holds the reins. No assets: everything
   is drawn and sounded in code, in the manner of Pattachitra /
   Madhubani folk painting — flat colour, bold ink, gold trim.
   ─────────────────────────────────────────────────────────────── */
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 960, H = 540, GY = 430, REACH = 345;
const FONT = '"Tiro Devanagari Sanskrit","Noto Serif Devanagari","Nirmala UI",Georgia,serif';
const C = { ink:'#1a0f1f', gold:'#e9b44c', ochre:'#d98324', vermil:'#c4361d', indigo:'#23245a', blue:'#3b5fc0',
            cream:'#f3e2b8', white:'#f4efe2', green:'#2f6b4f', maroon:'#5e1a24', earth:'#8a4b2a', skin:'#d9a066' };
const rnd = (a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick = a=>a[Math.floor(Math.random()*a.length)];
const lerp=(a,b,t)=>a+(b-a)*t;
const mix=(a,b,t)=>a.map((v,i)=>lerp(v,b[i],t));
const rgb=a=>`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;

/* ═════════════════════════ AUDIO (all synthesised) ═════════════════════════ */
let AC=null, master=null, muted=false, noiseBuf=null;
function initAudio(){
  if(AC) return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=muted?0:.55; master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    // tanpura-like drone: Sa Pa Sa' Sa
    [1,1.5,2,2.004].forEach((r,i)=>{
      const o=AC.createOscillator(), gn=AC.createGain(), f=AC.createBiquadFilter(), l=AC.createOscillator(), lg=AC.createGain();
      o.type='sawtooth'; o.frequency.value=65.41*r; f.type='lowpass'; f.frequency.value=420;
      gn.gain.value=.035; l.frequency.value=.12+i*.05; lg.gain.value=.03;
      l.connect(lg); lg.connect(gn.gain); o.connect(f); f.connect(gn); gn.connect(master); o.start(); l.start();
    });
  }catch(e){ AC=null; }
}
function setMute(m){ muted=m; if(master) master.gain.value=m?0:.55; }
function tone(f,d,type,v,f2,delay=0){
  if(!AC) return; const t=AC.currentTime+delay, o=AC.createOscillator(), gn=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);
  gn.gain.setValueAtTime(.0001,t); gn.gain.exponentialRampToValueAtTime(v,t+.01); gn.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(gn); gn.connect(master); o.start(t); o.stop(t+d+.05);
}
function noise(d,v,f1,f2,type='bandpass',delay=0){
  if(!AC) return; const t=AC.currentTime+delay, s=AC.createBufferSource(), f=AC.createBiquadFilter(), gn=AC.createGain();
  s.buffer=noiseBuf; f.type=type; f.frequency.setValueAtTime(f1,t); f.frequency.exponentialRampToValueAtTime(f2,t+d); f.Q.value=1.2;
  gn.gain.setValueAtTime(v,t); gn.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f); f.connect(gn); gn.connect(master); s.start(t); s.stop(t+d+.05);
}
const RAGA=[0,1,4,5,7,8,11,12,13,16];            // Bhairav
function pluck(i){ const f=261.63*Math.pow(2,RAGA[i%RAGA.length]/12); tone(f,.55,'triangle',.11); tone(f*2,.3,'sawtooth',.03); }
const sfx={
  shoot(p){ noise(.28,.18+.1*p,2600+p*1500,700); tone(150,.12,'triangle',.08,70); },
  hit(){ tone(190,.16,'square',.1,70); noise(.1,.2,1100,260); },
  kill(c){ pluck(c); tone(80,.2,'sine',.25,40); },
  bad(){ tone(110,.9,'sawtooth',.14,70); tone(117,.9,'sawtooth',.12,66); },
  bless(){ pluck(4); pluck(7); tone(523,.8,'sine',.06); },
  hurt(){ tone(95,.3,'square',.16,45); noise(.25,.25,800,150); },
  drum(){ tone(72,.28,'sine',.28,38); },
  hiss(){ noise(1.1,.22,5200,2200,'highpass'); },
  krishna(){ tone(330,.5,'sine',.08,495); noise(.3,.12,1500,500); },
  astra(){ tone(110,1.6,'sawtooth',.14,880); noise(1.4,.3,400,5000,'bandpass'); tone(660,1.2,'sine',.06,1320,.1); },
  crown(){ for(let i=0;i<6;i++) tone(1400+i*130,.35,'triangle',.05,900,i*.03); },
  conch(){
    if(!AC) return; const t=AC.currentTime;
    for(const [f,v] of [[233,.1],[350,.05],[466,.04]]){
      const o=AC.createOscillator(), gn=AC.createGain(), lp=AC.createBiquadFilter(), l=AC.createOscillator(), lg=AC.createGain();
      o.type='sawtooth'; o.frequency.setValueAtTime(f*.96,t); o.frequency.linearRampToValueAtTime(f,t+.5);
      lp.type='lowpass'; lp.frequency.value=1100; l.frequency.value=6; lg.gain.value=v*.35; l.connect(lg); lg.connect(gn.gain);
      gn.gain.setValueAtTime(.0001,t); gn.gain.linearRampToValueAtTime(v,t+.35); gn.gain.setValueAtTime(v,t+1.7); gn.gain.exponentialRampToValueAtTime(.0001,t+2.6);
      o.connect(lp); lp.connect(gn); gn.connect(master); o.start(t); l.start(t); o.stop(t+2.7); l.stop(t+2.7);
    }
  },
};

/* ═════════════════════════ DATA ═════════════════════════ */
const DAYS=[
  { en:'Day One', sa:'प्रथम दिवस', host:"The Host of Bhishma", n:13, gap:1.8,
    mix:[['inf',.6],['arch',1]], sky:{top:[29,18,64],mid:[138,47,74],hor:[240,160,75],sunY:395,sunR:62},
    line:["Rise, Partha. The conch has sounded — draw the Gandiva.","Hold to draw the bow, release to loose. Aim where the arrow will fall."],
    verse:{sa:'कर्मण्येवाधिकारस्ते मा फलेषु कदाचन',tr:'karmaṇy evādhikāras te mā phaleṣu kadācana',en:'You have a right to action alone — never to its fruits.',ref:'Bhagavad Gita 2.47'}},
  { en:'Day Eleven', sa:'एकादश दिवस', host:"Drona's Formation", n:17, gap:1.55,
    mix:[['inf',.35],['arch',.6],['char',.83],['sur',1]], sky:{top:[42,42,107],mid:[217,101,47],hor:[247,195,92],sunY:320,sunR:66},
    line:["Bhishma has fallen on his bed of arrows. Drona now leads them."],
    verse:{sa:'नैनं छिन्दन्ति शस्त्राणि नैनं दहति पावकः',tr:'nainaṃ chindanti śastrāṇi nainaṃ dahati pāvakaḥ',en:'Weapons cannot cleave the soul; fire cannot burn it.',ref:'Bhagavad Gita 2.23'}},
  { en:'Day Fifteen', sa:'पञ्चदश दिवस', host:"The War Elephants", n:19, gap:1.65,
    mix:[['inf',.28],['arch',.48],['char',.62],['ele',.84],['sur',1]], sky:{top:[58,61,143],mid:[232,150,58],hor:[251,224,138],sunY:235,sunR:70},
    line:["Mountains of war walk the field. Aim for the rider — and the beast will falter."],
    verse:{sa:'यदा यदा हि धर्मस्य ग्लानिर्भवति भारत',tr:'yadā yadā hi dharmasya glānir bhavati bhārata',en:'Whenever dharma declines, O Bharata, I come forth.',ref:'Bhagavad Gita 4.7'}},
  { en:'Day Seventeen', sa:'सप्तदश दिवस', host:"Karna, Son of Surya", boss:true, trickle:3.2,
    sky:{top:[26,12,46],mid:[163,32,31],hor:[232,99,31],sunY:398,sunR:74},
    line:["Karna — radiant, unbowed — rides against you.","When the serpent-arrow flies, call on me: SPACE."]},
];
const ED={ // speed, hit-box [x0,x1,h] (local, facing left), front offset, hp, score
  inf:{sp:46, box:[-13,14,56], fx:-14, hp:1, sc:10},
  arch:{sp:40, box:[-13,14,56], fx:-14, hp:1, sc:15},
  sur:{sp:30, box:[-13,14,56], fx:-14, hp:1, sc:0},
  char:{sp:112, box:[-190,34,70], fx:-190, hp:2, sc:25},
  ele:{sp:30, box:[-108,72,132], fx:-112, hp:5, sc:50},
};

/* ═════════════════════════ STATE ═════════════════════════ */
let state='title', G=null, mouse={x:700,y:300}, sky=null;
const stars=Array.from({length:60},()=>({x:rnd(0,W),y:rnd(0,230),r:rnd(.5,1.5),p:rnd(0,6)}));
const specks=Array.from({length:90},()=>({x:rnd(0,W),y:rnd(405,H),r:rnd(1,4),a:rnd(.05,.2)}));
function newGame(){
  G={ day:0, hp:100, dharma:100, astra:0, score:0, combo:0, t:0, dayT:0, enemies:[], arrows:[], eArrows:[], parts:[], pops:[],
      spawnLeft:0, spawnT:0, spawned:0, drawing:false, drawT:0, cool:0, low:0, lowCD:0, lowAmt:0, shake:0, flash:0, flashC:'196,54,29',
      boss:null, nag:null, say:null, sayQ:[], bannerT:0, drumT:0, crownBroken:false, struckWhileWheel:false, endT:0, interT:0, over:'', sawSur:false,
      astraFx:0, bless:0, trickleT:0 };
  sky=JSON.parse(JSON.stringify(DAYS[0].sky));
}
newGame();

function startDay(i){
  G.day=i; const d=DAYS[i];
  G.enemies.length=0; G.eArrows.length=0; G.arrows.length=0; G.nag=null; G.boss=null;
  G.spawnLeft=d.boss?0:d.n; G.spawnT=2.4; G.spawned=0; G.dayT=0; G.bannerT=3.6; G.trickleT=d.trickle||0; G.drawing=false;
  state='play'; sfx.conch();
  G.sayQ=[]; d.line.forEach((l,k)=>G.sayQ.push({who:'Krishna',text:l,dur:4.4,at:1.2+k*5}));
  if(d.boss){ G.sayQ.push({who:'Karna',text:"I have waited for this, Arjuna. Let the field decide!",dur:3.5,at:7}); }
}
function say(who,text,dur=4){ G.say={who,text,t:dur,dur}; }

/* ═════════════════════════ SPAWNING & ENEMIES ═════════════════════════ */
function mkEnemy(type){
  const lane=Math.floor(rnd(0,3)), D=ED[type];
  return { type, lane, y:GY+16+lane*22, x:W+120+rnd(0,40), t:rnd(0,6), hp:D.hp, hit:0, stopX:rnd(520,730), shoot:rnd(1.2,2.6), dead:false };
}
const scl=e=>[.95,1.03,1.12][e.lane];
function spawnOne(){
  const d=DAYS[G.day]; let r=Math.random(), type='inf';
  for(const [t,p] of d.mix){ if(r<p){type=t;break;} }
  if(G.day>=1 && !G.sawSur && G.spawned===4) type='sur';
  G.enemies.push(mkEnemy(type)); G.spawned++;
}
function spawnTrickle(){ G.enemies.push(mkEnemy(Math.random()<.2?'sur':(Math.random()<.5?'arch':'inf'))); }

function fireEArrow(e){
  const s=scl(e), x=e.x-16*s, y=e.y-40*s, tx=190, ty=355, dist=Math.hypot(tx-x,ty-y), T=dist/340, gr=260;
  G.eArrows.push({x,y,vx:(tx-x)/T,vy:(ty-y)/T-.5*gr*T,gr,dmg:6});
}
function spawnPetals(x,y,n,pal=[C.ochre,C.gold,'#f07b1d','#f6d365']){
  for(let i=0;i<n;i++) G.parts.push({k:'petal',x:x+rnd(-8,8),y:y+rnd(-8,8),vx:rnd(-90,90),vy:rnd(-190,-30),rot:rnd(0,6),vr:rnd(-6,6),life:rnd(.7,1.4),max:1.4,s:rnd(3,6),c:pick(pal)});
}
function spawnDust(x,y,n=3){ for(let i=0;i<n;i++) G.parts.push({k:'dust',x,y,vx:rnd(-20,20),vy:rnd(-25,-5),life:.7,max:.7,s:rnd(6,14),c:'#c28c58'}); }
function pop(x,y,txt,col=C.gold){ G.pops.push({x,y,txt,col,t:1.4}); }
function hurtPlayer(d,txt){
  G.hp-=d; G.shake=.35; G.flash=.4; G.flashC='196,54,29'; sfx.hurt(); G.combo=0;
  if(txt) pop(170,300,txt,'#ff8a6a');
  if(G.hp<=0){ G.hp=0; endGame('kavacha'); }
}
function addDharma(d,txt,col){
  G.dharma=clamp(G.dharma+d,0,100); if(txt) pop(300,330,txt,col);
  if(G.dharma<=0) endGame('dharma');
}
function killEnemy(e,byAstra){
  e.dead=true; const D=ED[e.type], s=scl(e);
  spawnPetals(e.x+(D.box[0]+D.box[1])/2*s,e.y-D.box[2]*s*.5,e.type==='ele'?26:e.type==='char'?16:9);
  G.combo++; G.score+=D.sc; if(!byAstra) G.astra=Math.min(100,G.astra+(e.type==='ele'?20:e.type==='char'?12:7));
  pop(e.x,e.y-D.box[2]*s-6,'+'+D.sc); sfx.kill(G.combo);
}
function endGame(why){ if(state!=='play') return; G.over=why; state='over'; G.endT=0; G.say=null; sfx.bad(); }

/* ═════════════════════════ INPUT ═════════════════════════ */
const BTN={ krishna:{x:896,y:452,r:36}, astra:{x:812,y:474,r:30} };
function toCanvas(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height}; }
function inBtn(p,b){ return Math.hypot(p.x-b.x,p.y-b.y)<=b.r+6; }
function doKrishna(){
  if(state!=='play'||G.lowCD>0) return;
  G.low=1.15; G.lowCD=2.3; sfx.krishna(); pop(170,300,'Krishna lowers the chariot','#9fc0ff');
}
function doAstra(){
  if(state!=='play'||G.astra<100) return;
  G.astra=0; G.astraFx=1.5; sfx.astra(); G.flash=.7; G.flashC='255,226,140'; G.shake=.5;
  setTimeout(()=>{ if(state!=='play') return;
    for(const e of G.enemies) if(!e.dead && e.type!=='sur') killEnemy(e,true);
    G.eArrows.length=0; if(G.boss&&!G.boss.dead){ damageBoss(3); }
    say('Krishna',"The astra spares those who lay down their arms.",3.5);
  },420);
}
function pointerDown(e){
  initAudio(); const p=toCanvas(e); mouse=p;
  if(state==='title'){ newGame(); startDay(0); return; }
  if(state==='over'||state==='win'){ if(G.endT>1.4){ newGame(); state='title'; } return; }
  if(state==='inter'){ if(G.interT>1.8) nextDay(); return; }
  if(inBtn(p,BTN.krishna)) return doKrishna();
  if(inBtn(p,BTN.astra)) return doAstra();
  G.drawing=true; G.drawT=0; try{cv.setPointerCapture(e.pointerId);}catch(_){}
}
function pointerUp(e){
  mouse=toCanvas(e);
  if(state==='play'&&G.drawing){ G.drawing=false; loose(); }
}
cv.addEventListener('pointerdown',pointerDown);
cv.addEventListener('pointermove',e=>{ mouse=toCanvas(e); });
cv.addEventListener('pointerup',pointerUp);
cv.addEventListener('pointercancel',()=>{ if(G) G.drawing=false; });
addEventListener('keydown',e=>{
  initAudio();
  if([' ','ArrowDown','Enter','q','Q','e','E','s','S'].includes(e.key)) e.preventDefault();
  if(e.repeat) return;
  const k=e.key;
  if(k==='m'||k==='M') return setMute(!muted);
  if(state==='title'&&(k==='Enter'||k===' ')){ newGame(); startDay(0); return; }
  if((state==='over'||state==='win')&&(k==='Enter'||k===' ')&&G.endT>1.4){ newGame(); state='title'; return; }
  if(state==='inter'&&(k==='Enter'||k===' ')&&G.interT>1.8){ nextDay(); return; }
  if(k===' '||k==='ArrowDown'||k==='s'||k==='S') doKrishna();
  if(k==='q'||k==='Q'||k==='e'||k==='E') doAstra();
});
addEventListener('blur',()=>{ if(G) G.drawing=false; });

/* ═════════════════════════ BOW & ARROWS ═════════════════════════ */
const CX=150;
const floorY=()=>408+G.lowAmt*12;
const bowPos=()=>({x:CX+0,y:floorY()-60});
const power=()=>clamp(G.drawT/.75,0,1);
const ARROW_G=560, arrowV=p=>520+640*p;
// Solve the arc that carries the arrow to the cursor at draw-strength p. If the
// cursor is out of reach at that strength, loft at the furthest-reaching angle.
function aimAngle(p=.8){
  const o=bowPos(), x=mouse.x-o.x, Y=-(mouse.y-o.y), v2=Math.pow(arrowV(p),2);
  if(x<40) return clamp(Math.atan2(mouse.y-o.y,mouse.x-o.x),-1.15,.35);
  const disc=v2*v2-ARROW_G*(ARROW_G*x*x+2*Y*v2);
  const th=disc<0?Math.atan(v2/(ARROW_G*x)):Math.atan((v2-Math.sqrt(disc))/(ARROW_G*x));
  return clamp(-th,-1.15,.35);
}
function loose(){
  if(G.cool>0){ return; }
  const p=Math.max(.12,power()), a=aimAngle(p), o=bowPos(), v=arrowV(p);
  G.arrows.push({x:o.x+Math.cos(a)*34,y:o.y+Math.sin(a)*34,vx:Math.cos(a)*v,vy:Math.sin(a)*v,stuck:0,life:4});
  G.cool=.22; sfx.shoot(p);
}
function damageBoss(n){
  const b=G.boss; if(!b||b.dead) return;
  b.hp-=n; b.hit=.15; sfx.hit(); spawnPetals(b.x-60,b.y-70,6,[C.gold,'#fff3b0']);
  if(b.wheel==='sunk'){ G.struckWhileWheel=true; }
  if(b.hp<=0){ b.dead=true; b.deadT=0; G.enemies.forEach(e=>{ if(!e.dead&&e.type!=='sur') killEnemy(e,true); }); G.nag=null; G.eArrows.length=0;
    for(let i=0;i<5;i++) setTimeout(()=>spawnPetals(b.x-60+rnd(-50,50),b.y-80+rnd(-40,40),22),i*180);
    G.score+=500; sfx.astra(); }
}

/* ═════════════════════════ UPDATE ═════════════════════════ */
function nextDay(){ startDay(G.day+1); }
function dayCleared(){
  G.score+=100*(G.day+1);
  if(DAYS[G.day].boss){ state='win'; G.endT=0; G.say=null; sfx.bless(); return; }
  state='inter'; G.interT=0; G.say=null; sfx.bless();
}
function update(dt){
  G.t+=dt; G.endT+=dt;
  // sky drift
  const tg=DAYS[state==='title'?0:G.day].sky, k=Math.min(1,dt*1.4);
  sky.top=mix(sky.top,tg.top,k); sky.mid=mix(sky.mid,tg.mid,k); sky.hor=mix(sky.hor,tg.hor,k);
  sky.sunY=lerp(sky.sunY,tg.sunY,k); sky.sunR=lerp(sky.sunR,tg.sunR,k);
  for(const p of G.parts){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.k==='petal'){ p.vy+=160*dt; p.rot+=p.vr*dt; p.vx*=.99; } else { p.s+=14*dt; } }
  G.parts=G.parts.filter(p=>p.life>0);
  for(const p of G.pops){ p.t-=dt; p.y-=26*dt; } G.pops=G.pops.filter(p=>p.t>0);
  G.shake=Math.max(0,G.shake-dt); G.flash=Math.max(0,G.flash-dt); G.astraFx=Math.max(0,G.astraFx-dt);
  if(state==='inter'){ G.interT+=dt; return; }
  if(state==='title'){ return; }
  if(state==='over'||state==='win'){ if(G.boss&&G.boss.dead) G.boss.deadT+=dt; return; }

  G.dayT+=dt; G.bannerT=Math.max(0,G.bannerT-dt);
  G.low=Math.max(0,G.low-dt); G.lowCD=Math.max(0,G.lowCD-dt); G.cool=Math.max(0,G.cool-dt);
  G.lowAmt+=((G.low>0?1:0)-G.lowAmt)*Math.min(1,dt*12);
  if(G.drawing) G.drawT=Math.min(.75,G.drawT+dt);
  G.drumT-=dt; if(G.drumT<=0){ sfx.drum(); G.drumT=1.15; }

  // speech queue
  for(const q of G.sayQ){ if(!q.done && G.dayT>=q.at && (!G.say||G.say.t<=0)){ q.done=true; say(q.who,q.text,q.dur); } }
  if(G.say) G.say.t-=dt;

  const d=DAYS[G.day];
  // spawning
  if(!d.boss){
    G.spawnT-=dt;
    if(G.spawnLeft>0 && G.spawnT<=0){ spawnOne(); G.spawnLeft--; G.spawnT=d.gap*rnd(.7,1.3); }
  } else {
    if(!G.boss && G.dayT>6){
      G.boss={x:W+260,targetX:770,y:GY+22,hp:16,max:16,hit:0,t:0,shoot:2.5,nagT:5,warn:0,wheel:null,wheelT:0,dead:false,deadT:0,state:'enter'};
    }
    if(G.boss&&!G.boss.dead&&G.boss.state==='fight'){ G.trickleT-=dt; if(G.trickleT<=0){ spawnTrickle(); G.trickleT=d.trickle*rnd(.8,1.4); } }
  }

  // enemies
  for(const e of G.enemies){
    if(e.dead) continue; e.t+=dt; e.hit=Math.max(0,e.hit-dt);
    const D=ED[e.type], s=scl(e);
    if(e.type==='arch'){
      if(e.x>e.stopX) e.x-=D.sp*dt; else { e.shoot-=dt; if(e.shoot<=0){ e.shoot=rnd(2.4,3.8); fireEArrow(e); } }
    } else e.x-=D.sp*dt;
    if(Math.random()<dt*3 && e.type!=='arch') spawnDust(e.x+8,e.y,1);
    if(e.type!=='arch' && e.x+D.fx*s<=REACH){
      e.dead=true;
      if(e.type==='sur'){ addDharma(7,'Blessed — a warrior of dharma',C.cream); G.bless=1; sfx.bless(); spawnPetals(e.x,e.y-40,14,[C.white,C.gold,'#ffd9e0']); }
      else { hurtPlayer(e.type==='ele'?24:e.type==='char'?14:8, e.type==='ele'?'The elephant crashes in!':'They are upon us!'); spawnPetals(REACH,e.y-30,8); }
    }
  }
  G.enemies=G.enemies.filter(e=>!e.dead||false);
  if(!G.sawSur && G.enemies.some(e=>e.type==='sur'&&e.x<W-40)){
    G.sawSur=true; G.say=null; say('Krishna',"That one has laid down his arms. Dharma forbids you to strike him.",5.5);
  }

  // player arrows

    if(a.stuck>0){ a.stuck-=dt; continue; }
    a.life-=dt;
    for(let s=0;s<3;s++){
      a.x+=a.vx*dt/3; a.vy+=ARROW_G*dt/3; a.y+=a.vy*dt/3;
      let hitDone=false;
      for(const e of G.enemies){
        if(e.dead) continue; const D=ED[e.type], sc=scl(e);
        const x0=e.x+D.box[0]*sc-3, x1=e.x+D.box[1]*sc+3, y1=e.y+4, y0=e.y-D.box[2]*sc-3;
        if(a.x>x0&&a.x<x1&&a.y>y0&&a.y<y1){

          if(e.type==='sur'){ e.dead=true; addDharma(-24,'ADHARMA! He had laid down his arms','#ff8a6a'); G.combo=0; sfx.bad(); G.shake=.3; G.flash=.35; G.flashC='60,30,120'; spawnPetals(e.x,e.y-30,10,[C.white,'#ccc']); }
          else { e.hp--; e.hit=.14; sfx.hit(); if(e.hp<=0) killEnemy(e,false); else spawnPetals(a.x,a.y,3); }
          break;

      }
      const b=G.boss;
      if(!hitDone && b && !b.dead && b.state!=='enter'){
        const x0=b.x-250, x1=b.x+50, y0=b.y-125, y1=b.y+4;
        if(a.x>x0&&a.x<x1&&a.y>y0&&a.y<y1){ damageBoss(1); a.life=0; hitDone=true; }
      }
      if(hitDone) break;
      if(a.y>GY+58){ a.stuck=1.2; a.vx=a.vy=0; a.y=GY+58; break; }
    }
  }
  G.arrows=G.arrows.filter(a=>a.life>0||a.stuck>0);

  // enemy arrows
  for(const a of G.eArrows){
    a.x+=a.vx*dt; a.vy+=a.gr*dt; a.y+=a.vy*dt;
    if(a.x<340&&a.x>100&&a.y>285&&a.y<440){ a.dead=true; hurtPlayer(a.dmg,null); spawnPetals(a.x,a.y,3,['#ddd',C.gold]); }
    if(a.y>H||a.x<0) a.dead=true;
  }
  G.eArrows=G.eArrows.filter(a=>!a.dead);

  // Karna
  const b=G.boss;
  if(b){
    b.t+=dt; b.hit=Math.max(0,b.hit-dt);
    if(b.dead){ b.deadT+=dt; if(b.deadT>3.2 && state==='play') dayCleared(); }
    else if(b.state==='enter'){ b.x-=130*dt; if(b.x<=b.targetX){ b.x=b.targetX; b.state='fight'; } }
    else {
      if(b.wheel==='sunk'){
        b.wheelT-=dt; if(b.wheelT<=0){ b.wheel='done'; say('Karna',"The wheel is free! Now, Arjuna — to the end!",3); b.shoot=1; b.fury=true; }
      } else {
        if(b.hp<=b.max*.4 && !b.wheel){
          b.wheel='sunk'; b.wheelT=7.5; b.warn=0; G.nag=null; G.say=null;
          say('Krishna',"His wheel has sunk. He stoops to free it, unarmed. Strike — or wait, Partha? Weigh it.",6.5);
          sfx.bless();
        }
        b.shoot-=dt; if(b.shoot<=0){
          b.shoot=b.fury?rnd(1.0,1.7):rnd(1.7,2.6);
          const x=b.x-230, y=b.y-90, tx=190, ty=360, T=Math.hypot(tx-x,ty-y)/420, gr=260;
          G.eArrows.push({x,y,vx:(tx-x)/T,vy:(ty-y)/T-.5*gr*T,gr,dmg:8});
        }
        if(b.warn>0){
          b.warn-=dt;
          if(b.warn<=0){ G.nag={x:b.x-250,y:338,t:0}; }
        } else if(!G.nag){
          b.nagT-=dt; if(b.nagT<=0){ b.nagT=b.fury?rnd(5,6.5):rnd(6.5,8.5); b.warn=1.25; sfx.hiss(); G.say=null; say('Krishna',"The Nagastra! Call me, Partha — SPACE!",1.8); }
        }
      }
    }
  }
  const n=G.nag;
  if(n){
    n.t+=dt; n.x-=820*dt;
    if(n.x<=205){
      if(G.lowAmt>.55){ G.crownBroken=true; sfx.crown(); pop(200,262,'The serpent-arrow shatters only your crown!',C.gold); spawnPetals(180,320,16,[C.gold,'#fff3b0']); G.shake=.4; }
      else hurtPlayer(40,'The Nagastra strikes!');
      G.nag=null;
    }
  }

  // clear

    G.clearT=(G.clearT||0)+dt; if(G.clearT>1.6){ G.clearT=0; dayCleared(); }
  } else G.clearT=0;
  G.bless=Math.max(0,G.bless-dt);
}

  for(const p of G.parts){
    const al=clamp(p.life/p.max*1.5,0,1);
    if(p.k==='petal'){ g.save(); g.globalAlpha=al; g.translate(p.x,p.y); g.rotate(p.rot); g.fillStyle=p.c; g.strokeStyle=C.ink; g.lineWidth=1; g.beginPath(); g.ellipse(0,0,p.s,p.s*.5,0,0,7); g.fill(); g.stroke(); g.restore(); }
    else { g.save(); g.globalAlpha=al*.35; g.fillStyle=p.c; g.beginPath(); g.arc(p.x,p.y,p.s,0,7); g.fill(); g.restore(); }
  }
  // astra sweep
  if(G.astraFx>0){ const k=1-G.astraFx/1.5, x=190+k*900; g.save(); g.globalCompositeOperation='lighter';
    const gr=g.createLinearGradient(x-260,0,x+30,0); gr.addColorStop(0,'rgba(255,200,80,0)'); gr.addColorStop(.85,'rgba(255,230,150,.7)'); gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=gr; g.fillRect(x-260,0,290,H); g.restore(); }
  for(const p of G.pops){ g.save(); g.globalAlpha=clamp(p.t*1.5,0,1); txt(p.txt,p.x,p.y,p.txt.length>12?16:19,p.col,'center',C.ink); g.restore(); }
  g.restore();
  g.drawImage(VIG,0,0);
  if(G.flash>0){ g.fillStyle=`rgba(${G.flashC},${clamp(G.flash,0,.5)*.9})`; g.fillRect(0,0,W,H); }
  if(state==='play'||state==='over'||state==='win') drawHUD(t);
  g.drawImage(FRAME,0,0);
  if(state==='title') drawTitle(t);
  else if(state==='inter') drawInter(t);
  else if(state==='over') drawOver(t);
  else if(state==='win') drawWin(t);
}

/* ═════════════════════════ LOOP ═════════════════════════ */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  try{ update(dt); render(); }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.DK={ get G(){return G;}, get state(){return state;}, set state(v){state=v;}, startDay, newGame, damageBoss, endGame, dayCleared, setMouse(x,y){mouse={x,y};} };
</script>
