# Security response headers.
#
# nginx's add_header does NOT inherit into a location block that declares its
# own add_header. Every location below that sets Cache-Control therefore
# re-includes this file. If you add a location with an add_header of its own,
# include this file there too or it will silently serve unprotected responses.

# Content-Security-Policy is the header that actually contains an XSS. Tune the
# two host-specific lines below, then verify in DevTools -> Console that no
# resource is being blocked.
#
#   connect-src  must list your Supabase project URL, both https and wss
#                (Realtime uses a WebSocket). Add any other API you call.
#   style-src    keeps 'unsafe-inline' because Radix/shadcn inject inline styles
#                for positioning. Inline STYLE cannot execute JavaScript, so
#                this is a much smaller concession than 'unsafe-inline' on
#                script-src - which must never be added.
#   img-src      allows https: broadly for remote product images. Narrow it to
#                your storage bucket host if you can.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://YOUR-PROJECT-REF.supabase.co wss://YOUR-PROJECT-REF.supabase.co; worker-src 'self' blob:; manifest-src 'self'" always;

# Stops the browser from MIME-sniffing a response into an executable type.
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking. frame-ancestors in the CSP above is the modern control; this is
# the fallback for older browsers.
add_header X-Frame-Options "DENY" always;

# Don't leak full URLs (which may carry ids or tokens) to third-party hosts.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Deny device APIs this app has no reason to use.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# Isolates the browsing context; blocks cross-origin window references.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# HSTS - commented out on purpose. Over plain http:// it does nothing, and if
# you enable it while testing on localhost the browser will pin localhost to
# HTTPS for every other project on your machine. Uncomment only when this is
# served over real TLS on a real domain.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
