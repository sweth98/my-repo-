server {
    # 8080, not 80: an unprivileged process cannot bind a port below 1024.
    #
    # Deliberately IPv4-only. A `listen [::]:8080;` line makes nginx abort at
    # startup ("Address family not supported by protocol") on any host where
    # IPv6 is disabled in the container - a common Docker default. Publishing
    # the port handles host-side IPv6 regardless, so there is nothing to gain.
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in responses or error pages.
    server_tokens off;

    # Reject absurd request bodies outright. A static SPA uploads nothing.
    client_max_body_size 1m;
    client_body_timeout  10s;
    client_header_timeout 10s;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    include /etc/nginx/snippets/security-headers.conf;

    # Container healthcheck target. Kept out of the access log so it doesn't
    # drown real traffic.
    location = /healthz {
        access_log off;
        # Re-included because the add_header below would otherwise suppress the
        # server-level headers entirely - the exact inheritance rule described
        # in security-headers.conf.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints every file in /assets (app.4f3a9c21.js). The content of
    # a given filename can never change, so cache it forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html is the deploy pointer - it names the current asset hashes. It
    # must never be cached, or browsers will keep loading a deleted bundle.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Nothing sensitive should be in the image at all, but deny the classic
    # accidents explicitly rather than relying on that.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
    location ~* \.(env|map|json\.bak|bak|old|swp)$ {
        # Source maps are excluded here because they hand an attacker your
        # original TypeScript. If you want them for debugging, serve them only
        # from a non-public environment.
        deny all;
        return 404;
    }

    # Client-side routing: any unmatched path is a React Router route, so hand
    # back index.html and let the app resolve it. This must stay last.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
