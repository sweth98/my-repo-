services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Read from your shell or a .env file sitting next to this compose file.
        # These end up inside the JS bundle - public by definition. See README.
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?set VITE_SUPABASE_URL in .env}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?set VITE_SUPABASE_ANON_KEY in .env}
    image: ayurvedic-harvest-hub:local
    container_name: ayurvedic-harvest-hub

    # Bind to the loopback interface only. Without the 127.0.0.1 prefix Docker
    # writes an iptables rule that punches "8080" straight through your host
    # firewall, exposing this to everyone on your wifi. This is the single most
    # important line in the file for a local deployment.
    ports:
      - "127.0.0.1:8080:8080"

    # The filesystem is immutable at runtime. Nothing in a static file server
    # needs to write to disk, so an attacker who finds an RCE has nowhere to
    # drop a payload.
    read_only: true

    # ...except nginx's own scratch space, which is mounted as tmpfs (in RAM,
    # noexec, discarded on stop). uid/gid 101 matches the nginx user.
    tmpfs:
      - /tmp:mode=1777,size=16m,noexec,nosuid,nodev
      - /var/cache/nginx:mode=0700,uid=101,gid=101,size=32m,noexec,nosuid,nodev
      - /var/run:mode=0755,uid=101,gid=101,size=1m,noexec,nosuid,nodev

    # Blocks setuid binaries from gaining privileges - defeats the standard
    # container escalation path.
    security_opt:
      - no-new-privileges:true

    # Drop every Linux capability. Serving files on a high port needs none.
    cap_drop:
      - ALL

    user: "101:101"

    restart: unless-stopped

    # Caps the blast radius of a resource-exhaustion bug or a fork bomb.
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0

    # Unbounded container logs are a real way to fill a laptop disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    networks:
      - frontend

networks:
  frontend:
    driver: bridge
