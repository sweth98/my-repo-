unication (ASK/FSK) returns RX power requests to the TX controller</text><text x="20" y="230" class="h" style="fill:#b45309">Z2 - Laptop (experimental)</text><rect x="20" y="240" width="70" height="44" rx="6" fill="#e5e7eb" stroke="#1f2937"/><text x="55.0" y="266.0" text-anchor="middle" class="t">20 V PD</text><line x1="90" y1="262" x2="110" y2="262" stroke="#1f2937" stroke-width="1.6" marker-end="url(#a)"/><text x="100.0" y="256.0" text-anchor="middle" class="s"></text><rect x="110" y="240" width="140" height="44" rx="6" fill="#fecaca" stroke="#1f2937"/><text x="180.0" y="266.0" text-anchor="middle" class="t">Buck-boost DC-link</text><line x1="250" y1="262" x2="270" y2="262" stroke="#1f2937" stroke-width="1.6" marker-end="url(#a)"/><text x="260.0" y="256.0" text-anchor="middle" class="s"></text><rect x="270" y="240" width="150" height="44" rx="6" fill="#fecaca" stroke="#1f2937"/><text x="345.0" y="266.0" text-anchor="middle" class="t">Full-bridge ~110 kHz</text><line x1="420" y1="262" x2="440" y2="262" stroke="#1f2937" stroke-width="1.6" marker-end="url(#a)"/><text x="430.0" y="256.0" text-anchor="middle" class="s"></text><rect x="440" y="240" width="100" height="44" rx="6" fill="#fde68a" stroke="#1f2937"/><text x="490.0" y="266.0" text-anchor="middle" class="t">C_tx + L_tx</text><line x1="540" y1="262" x2="580" y2="262" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/><text x="560" y="234" text-anchor="middle" class="s">gap 6-10 mm</text><rect x="580" y="240" width="100" height="44" rx="6" fill="#fde68a" stroke="#1f2937"/><text x="630.0" y="266.0" text-anchor="middle" class="t">L_rx + C_rx</text><line x1="680" y1="262" x2="700" y2="262" stroke="#1f2937" stroke-width="1.6" marker-end="url(#a)"/><text x="690.0" y="256.0" text-anchor="middle" class="s"></text><rect x="700" y="240" width="80" height="44" rx="6" fill="#e5e7eb" stroke="#1f2937"/><text x="740.0" y="266.0" text-anchor="middle" class="t">Rectifier</text><line x1="740" y1="284" x2="740" y2="330" stroke="#1f2937" stroke-width="1.6" marker-end="url(#a)"/><text x="740.0" y="301.0" text-anchor="middle" class="s"></text><rect x="660" y="330" width="150" height="44" rx="6" fill="#e5e7eb" stroke="#1f2937"/><text x="735.0" y="356.0" text-anchor="middle" class="t">Buck + PD source</text><line x1="660" y1="352" x2="600" y2="352" stroke="#1f2937" stroke-width="1.6" marker-end="url(#a)"/><text x="630.0" y="346.0" text-anchor="middle" class="s"></text><rect x="480" y="330" width="120" height="44" rx="6" fill="#bbf7d0" stroke="#1f2937"/><text x="540.0" y="356.0" text-anchor="middle" class="t">USB-C -> laptop</text><rect x="560" y="420" width="230" height="40" rx="6" fill="#e0e7ff" stroke="#1f2937"/><text x="675.0" y="444.0" text-anchor="middle" class="t">RX ESP32-C3 (BLE telemetry)</text><line x1="560" y1="440" x2="330" y2="440" stroke="#1f2937" stroke-width="1.6" marker-end="url(#a)"/><text x="445.0" y="434.0" text-anchor="middle" class="s">Vout, Iout, T, contract</text><rect x="200" y="420" width="130" height="40" rx="6" fill="#e0e7ff" stroke="#1f2937"/><text x="265.0" y="444.0" text-anchor="middle" class="t">Hub ESP32-S3</text><line x1="265" y1="420" x2="265" y2="290" stroke="#1f2937" stroke-width="1.6" marker-end="url(#a)"/><text x="265.0" y="349.0" text-anchor="middle" class="s">DC-link / enable</text><text x="20" y="500" class="s">Hardware safety latch (NTC comparators + INA226 alert + eFuse PG) can cut the inverter enable independent of firmware.</text></svg>