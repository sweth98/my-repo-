f">Buck-boost</text><rect x="648.6" y="457.0" width="82.8" height="64.8" fill="#1d6b3a" opacity=".55" stroke="#1f2937" stroke-dasharray="5 3"/><text x="690.0" y="497.0" text-anchor="middle" class="s" style="fill:#fff">HW latch</text><rect x="74.0" y="104.0" width="28" height="20" fill="#9ca3af" stroke="#1f2937"/><text x="88.0" y="118.0" text-anchor="middle" class="s">FAN</text><rect x="80.0" y="115.0" width="20" height="10" fill="#d1d5db" stroke="#1f2937"/><rect x="740.0" y="115.0" width="20" height="10" fill="#d1d5db" stroke="#1f2937"/><rect x="80.0" y="535.0" width="20" height="10" fill="#d1d5db" stroke="#1f2937"/><rect x="740.0" y="535.0" width="20" height="10" fill="#d1d5db" stroke="#1f2937"/><text x="420.0" y="116.0" text-anchor="middle" class="s">gray = load cells | copper = TX coils | grey ring = ferrite | dashed green = power PCBs on the LOWER layer (under spreader)</text><line class="dim" x1="60.0" y1="80" x2="780.0" y2="80"/><line class="dim" x1="60.0" y1="75" x2="60.0" y2="85"/><line class="dim" x1="780.0" y1="75" x2="780.0" y2="85"/><text x="420.0" y="74" text-anchor="middle" class="s">360</text><line class="dim" x1="805.0" y1="90.0" x2="805.0" y2="570.0"/><line class="dim" x1="800.0" y1="90.0" x2="810.0" y2="90.0"/><line class="dim" x1="800.0" y1="570.0" x2="810.0" y2="570.0"/><text x="813.0" y="330.0" class="s">240</text></svg>