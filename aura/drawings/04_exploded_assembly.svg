</style><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="28" class="h">AURA - Exploded assembly</text><text x="20" y="46" class="s">Isometric-style stack, bottom=1. Dimensions in mm. Schematic concept drawing, not a manufacturing drawing.</text><polygon points="190.0,107.0 340,90 490.0,107.0 340,124" fill="#0f1318" stroke="#1f2937"/><line class="dim" x1="340" y1="107.0" x2="340" y2="107.0"/><text x="506.0" y="111.0" class="t">7 Glass top 4 mm + frit + IR window</text><line class="dim" stroke-dasharray="3 3" x1="340" y1="124" x2="340" y2="152"/><polygon points="190.0,169.0 340,152 490.0,169.0 340,186" fill="#3b82f6" stroke="#1f2937"/><line class="dim" x1="340" y1="169.0" x2="340" y2="169.0"/><text x="506.0" y="173.0" class="t">6 LED light guide + diffuser</text><line class="dim" stroke-dasharray="3 3" x1="340" y1="186" x2="340" y2="214"/><polygon points="190.0,231.0 340,214 490.0,231.0 340,248" fill="#7c9a6d" stroke="#1f2937"/><line class="dim" x1="340" y1="231.0" x2="340" y2="231.0"/><text x="506.0" y="235.0" class="t">5 Sensor/FOD PCB: LDC x4, Hall x4, ToF x2</text><line class="dim" stroke-dasharray="3 3" x1="340" y1="248" x2="340" y2="276"/><polygon points="190.0,293.0 340,276 490.0,293.0 340,310" fill="#c87533" stroke="#1f2937"/><line class="dim" x1="340" y1="293.0" x2="340" y2="293.0"/><text x="506.0" y="297.0" class="t">4 Z2 coil + ferrite  |  Z1 Qi2 module + magnets</text><line class="dim" stroke-dasharray="3 3" x1="340" y1="310" x2="340" y2="338"/><polygon points="190.0,355.0 340,338 490.0,355.0 340,372" fill="#9ca3af" stroke="#1f2937"/><line class="dim" x1="340" y1="355.0" x2="340" y2="355.0"/><text x="506.0" y="359.0" class="t">3 Al spreader + load-cell carrier</text><line class="dim" stroke-dasharray="3 3" x1="340" y1="372" x2="340" y2="400"/><polygon points="190.0,417.0 340,400 490.0,417.0 340,434" fill="#1d6b3a" stroke="#1f2937"/><line class="dim" x1="340" y1="417.0" x2="340" y2="417.0"/><text x="506.0" y="421.0" class="t">2 Main PCB: ESP32-S3, inverter, buck-boost, protection</text><line class="dim" stroke-dasharray="3 3" x1="340" y1="434" x2="340" y2="462"/><polygon points="190.0,479.0 340,462 490.0,479.0 340,496" fill="#d7dadf" stroke="#1f2937"/><line class="dim" x1="340" y1="479.0" x2="340" y2="479.0"/><text x="506.0" y="483.0" class="t">1 Aluminium base + blower + feet</text></svg>